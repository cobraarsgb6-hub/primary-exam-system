    let currentVideoId = null;

    var isolatedPlayerState = {
      isPlaying: false,
      isMuted: false,
      duration: 0,
      currentTime: 0,
      volume: 100,
      endIntercepted: false,
      currentVideoId: '',
      currentTitle: ''

    function postYtCommand(func, args) {
      var iframe = document.getElementById('video-iframe');
      if (!iframe || !iframe.contentWindow) return;
      var msg = JSON.stringify({
        event: 'command',
        func: func,
        args: args || []
      });
      iframe.contentWindow.postMessage(msg, '*');
    }

    function handleVideoShieldClick(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
      toggleIsolatedPlay();
    }

    function toggleIsolatedPlay() {
      var btn = document.getElementById('btn-vctrl-play');
      var nativePlayer = document.getElementById('native-video-player');
      
      if (nativePlayer && nativePlayer.style.display !== 'none' && nativePlayer.src) {
        if (nativePlayer.paused) {
          nativePlayer.play();
          if (btn) btn.innerHTML = '⏸️ إيقاف';
          isolatedPlayerState.isPlaying = true;
        } else {
          nativePlayer.pause();
          if (btn) btn.innerHTML = '▶️ تشغيل';
          isolatedPlayerState.isPlaying = false;
        }
        return;
      }

      if (isolatedPlayerState.isPlaying) {
        postYtCommand('pauseVideo');
        isolatedPlayerState.isPlaying = false;
        if (btn) btn.innerHTML = '▶️ تشغيل';
      } else {
        postYtCommand('playVideo');
        isolatedPlayerState.isPlaying = true;
        if (btn) btn.innerHTML = '⏸️ إيقاف';
      }
    }

    function seekIsolatedRelative(delta) {
      var target = Math.max(0, isolatedPlayerState.currentTime + delta);
      if (isolatedPlayerState.duration > 0) {
        target = Math.min(target, isolatedPlayerState.duration - 2);
      }
      var nativePlayer = document.getElementById('native-video-player');
      if (nativePlayer && nativePlayer.style.display !== 'none' && nativePlayer.src) {
        nativePlayer.currentTime = target;
        return;
      }
      postYtCommand('seekTo', [target, true]);
    }

    function onVideoSeekInput(val) {
      if (isolatedPlayerState.duration > 0) {
        var cur = (val / 100) * isolatedPlayerState.duration;
        var curEl = document.getElementById('vctrl-time-current');
        if (curEl) curEl.textContent = formatVideoTime(cur);
      }
    }

    function onVideoSeekChange(val) {
      if (isolatedPlayerState.duration > 0) {
        var target = (val / 100) * isolatedPlayerState.duration;
        var nativePlayer = document.getElementById('native-video-player');
        if (nativePlayer && nativePlayer.style.display !== 'none' && nativePlayer.src) {
          nativePlayer.currentTime = target;
        } else {
          postYtCommand('seekTo', [target, true]);
        }
      }
    }

    function toggleIsolatedMute() {
      var btn = document.getElementById('btn-vctrl-mute');
      isolatedPlayerState.isMuted = !isolatedPlayerState.isMuted;
      var nativePlayer = document.getElementById('native-video-player');
      if (nativePlayer && nativePlayer.style.display !== 'none' && nativePlayer.src) {
        nativePlayer.muted = isolatedPlayerState.isMuted;
      } else {
        if (isolatedPlayerState.isMuted) {
          postYtCommand('mute');
        } else {
          postYtCommand('unMute');
        }
      }
      if (btn) btn.textContent = isolatedPlayerState.isMuted ? '🔇' : '🔊';
    }

    function onIsolatedVolumeChange(val) {
      var nativePlayer = document.getElementById('native-video-player');
      isolatedPlayerState.volume = parseInt(val, 10);
      if (nativePlayer && nativePlayer.style.display !== 'none' && nativePlayer.src) {
        nativePlayer.volume = isolatedPlayerState.volume / 100;
      } else {
        postYtCommand('setVolume', [isolatedPlayerState.volume]);
        if (isolatedPlayerState.isMuted && isolatedPlayerState.volume > 0) {
          isolatedPlayerState.isMuted = false;
          var btn = document.getElementById('btn-vctrl-mute');
          if (btn) btn.textContent = '🔊';
          postYtCommand('unMute');

    function toggleIsolatedFullscreen() {

          container.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    function formatVideoTime(sec) {
      sec = Math.max(0, Math.floor(sec || 0));
      var m = Math.floor(sec / 60);
      var s = sec % 60;
      return (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
    }

    /* Window message listener for YouTube postMessage API */
    window.addEventListener('message', function(event) {
      if (!event || !event.data) return;
      var data = event.data;
      if (typeof data === 'string') {
        try {
          data = JSON.parse(data);
        } catch (e) {
          return;
        }
      }
      if (!data) return;

      /* Intercept time updates and state changes */
      if (data.event === 'infoDelivery' && data.info) {
        var info = data.info;
        if (typeof info.duration === 'number' && info.duration > 0) {
          isolatedPlayerState.duration = info.duration;
          var durEl = document.getElementById('vctrl-time-total');
          if (durEl) durEl.textContent = formatVideoTime(info.duration);
        }
        if (typeof info.currentTime === 'number') {
          isolatedPlayerState.currentTime = info.currentTime;
          var curEl = document.getElementById('vctrl-time-current');
          if (curEl) curEl.textContent = formatVideoTime(info.currentTime);

          if (isolatedPlayerState.duration > 0) {
            var seek = document.getElementById('vctrl-seek');
            if (seek) seek.value = (info.currentTime / isolatedPlayerState.duration) * 100;

            /* STRICT INVARIANT: 2-second early interception to block end-screen suggestions */
            if (info.currentTime >= isolatedPlayerState.duration - 2 && isolatedPlayerState.duration > 5) {
              triggerCelebrationScreen();
            }
          }
        }
        if (typeof info.playerState === 'number') {
          /* playerState 0 = ended, 1 = playing, 2 = paused */
          if (info.playerState === 0) {
            triggerCelebrationScreen();
          } else if (info.playerState === 1) {
            isolatedPlayerState.isPlaying = true;
            var btnPlay = document.getElementById('btn-vctrl-play');
            if (btnPlay) btnPlay.innerHTML = '⏸️ إيقاف';
          } else if (info.playerState === 2) {
            isolatedPlayerState.isPlaying = false;
            var btnPlay = document.getElementById('btn-vctrl-play');
            if (btnPlay) btnPlay.innerHTML = '▶️ تشغيل';
          }
        }
      }
    });

    function setVideoPlayerMode(mode) {
      const nativePlayer = document.getElementById('native-video-player');
      const iframe = document.getElementById('video-iframe');
      const placeholder = document.getElementById('video-placeholder');
      const shield = document.getElementById('video-pointer-shield');
      const controlsBar = document.getElementById('isolated-controls-bar');

      const btnNative = document.getElementById('btn-mode-native');

      /* Reset celebration state */
      if (celebration) celebration.style.display = 'none';
      isolatedPlayerState.endIntercepted = false;

      // Check if video is registered in Google Drive
      const driveMeta = (window.DRIVE_VIDEOS && window.DRIVE_VIDEOS[currentVideoId]);

      if (mode === 'drive' && driveMeta) {
        if (nativePlayer) { nativePlayer.pause(); nativePlayer.src = ''; nativePlayer.style.display = 'none'; }
        if (placeholder) placeholder.style.display = 'none';
        if (shield) shield.style.display = 'block';
        if (controlsBar) controlsBar.style.display = 'flex';
        if (iframe) {
          iframe.src = driveMeta.previewUrl;
          iframe.style.display = 'block';
        }
        if (btnCloud) { btnCloud.style.background = '#0369a1'; btnCloud.style.color = '#fff'; }
        if (btnNative) { btnNative.style.background = '#fff'; btnNative.style.color = '#334155'; }
        if (statusText) statusText.innerHTML = '☁️ <b>Cloud Stream (Google Drive)</b> - Ad-free high-speed playback';
      } else if (mode === 'native') {
        if (iframe) { iframe.src = ''; iframe.style.display = 'none'; }
        if (placeholder) placeholder.style.display = 'none';
        if (shield) shield.style.display = 'none';
        if (controlsBar) controlsBar.style.display = 'flex';
        if (nativePlayer) {
          var serverHost = window.LOCAL_VIDEO_HOST || '192.168.1.96:8085';
          nativePlayer.src = 'http:\/\/' + serverHost + '\/stream\/' + currentVideoId + '.mp4';
          nativePlayer.style.display = 'block';
          nativePlayer.play().catch(function(e) { console.log('Autoplay deferred:', e); });
        }
        if (btnNative) { btnNative.style.background = '#2563eb'; btnNative.style.color = '#fff'; }
        if (btnCloud) { btnCloud.style.background = '#fff'; btnCloud.style.color = '#334155'; }
        if (statusText) statusText.innerHTML = '⚡ <b>Local Stream (Offline Only)</b>';
      } else {
        // DEFAULT: Cloud YouTube Stream (Strictly In-Platform & Zero Distractions)
        if (nativePlayer) {
          nativePlayer.pause();
          nativePlayer.src = '';
          nativePlayer.style.display = 'none';
        }
        if (!currentVideoId || !currentVideoId.trim()) {
          if (iframe) { iframe.src = ''; iframe.style.display = 'none'; }
          if (shield) shield.style.display = 'none';
          if (controlsBar) controlsBar.style.display = 'none';
          if (placeholder) placeholder.style.display = 'flex';
          if (btnCloud) { btnCloud.style.background = '#fff'; btnCloud.style.color = '#334155'; }
          if (btnNative) { btnNative.style.background = '#fff'; btnNative.style.color = '#334155'; }
          if (statusText) statusText.innerHTML = '🎬 <b>الفيديو قيد الإعداد والمراجعة من المعلم</b>';
          return;
        }

        let cleanId = currentVideoId.trim();
        if (cleanId.indexOf('youtu.be/') !== -1) {
          cleanId = cleanId.split('youtu.be/')[1].split('?')[0];
        } else if (cleanId.indexOf('watch?v=') !== -1) {
          cleanId = cleanId.split('watch?v=')[1].split('&')[0];
        }

        if (iframe) {
          /* STRICT IN-PLATFORM ISOLATION:
           * 1. youtube-nocookie.com: Privacy-enhanced mode
           * 2. enablejsapi=1: Enables programmatic time monitoring
           * 3. rel=0: No outside recommended videos
           * 4. modestbranding=1: Eliminates YouTube logo from control bar
           * 5. controls=0: Disables default YouTube controls in favor of in-platform custom controls
           * 6. disablekb=1: Disables YouTube keyboard shortcuts to prevent external popups
           * 7. fs=0: Disables YouTube iframe fullscreen (handled in-platform)
           * 8. iv_load_policy=3: Eliminates interactive video annotations and channel links
           * 9. playsinline=1: Forces in-app playback on mobile / tablet
           */
          const embedUrl = 'https:\/\/www.youtube-nocookie.com\/embed\/' + cleanId +
            '?enablejsapi=1&rel=0&modestbranding=1&controls=0&disablekb=1&fs=0&playsinline=1&iv_load_policy=3&origin=' +
            encodeURIComponent(window.location.origin || 'https:\/\/script.google.com');
          iframe.src = embedUrl;
          iframe.style.display = 'block';
        }
        if (placeholder) placeholder.style.display = 'none';
        if (shield) shield.style.display = 'block';
        if (controlsBar) controlsBar.style.display = 'flex';
        if (btnCloud) { btnCloud.style.background = '#2563eb'; btnCloud.style.color = '#fff'; }
        if (btnNative) { btnNative.style.background = '#fff'; btnNative.style.color = '#334155'; }
        if (statusText) statusText.innerHTML = '🔒 <b>مشغل معزول آمن</b> (ممنوع الخروج ليوتيوب)';
      }
    }

    function applyCustomVideoUrl() {
      const input = document.getElementById('custom-video-input');
      if (!input || !input.value.trim()) return;
      const url = input.value.trim();
      let extractedId = url;
      // Match YouTube ID from URL formats
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      if (match && match[2].length === 11) {
        extractedId = match[2];
      }
      currentVideoId = extractedId;
      if (currentActiveSubject) {
        safeStorage.setItem('custom_vid_' + currentActiveSubject.id, extractedId);
      }
      setVideoPlayerMode('cloud');
      alert('Video updated successfully!');
    }

ZBUyzfCcTo", "title": "كتابة نص معلوماتي (التعبير الكتابي)", "subject": "اللغة العربية (تعبير)", "grade": "الصف السادس الابتدائي", "student": "Mostafa", "duration": "12 mins", "overview": "دليل كتابة النص المعلوماتي وفق معايير المنهج الجديد للصف السادس (نقل حقائق موثوقة دون انحياز شخصي).", "goldenRules": ["النص المعلوماتي: نص يقدم حقائق وأرقاماً ومعلومات علمية دقيقة ومرتبة حول موضوع معين.", "العناصر الأساسية الأربعة للنص المعلوماتي:", "  1. العنوان: موجز، جذاب، ويدل مباشرة على محتوى النص.", "  2. المقدمة: تشمل جملة افتتاحية تمهيدية وتعريفاً عاماً بالموضوع الرئيسي.", "  3. الفكر الفرعية (صلب الموضوع): فقرات متسلسلة تحتوي على حقائق وبنود وأرقام وأدلة.", "  4. الخاتمة: تلخيص شامل لما ورد في النص، مع تقديم توصية أو جملة ختامية محفزة للقارئ.", "الضوابط اللغوية: استخدام الأفعال المضارعة والماضية الدقيقة، علامات الترقيم الصحيحة، وتجنب العامية."], "examples": [{"sentence": "مثال لمقدمة نص معلوماتي عن الطاقة الشمسية: 'تعد الطاقة الشمسية أحد أهم مصادر الطاقة النظيفة والمتجددة في القرن الحادي والعشرين...'", "analysis": "مقدمة نموذجية تبدأ بجملة افتتاحية قوية وتعريف علمي مباشر."}], "quickCheck": [{"question": "ما الفرق بين النص المعلوماتي والنص السردي القصصي؟", "answer": "النص المعلوماتي يركز على الحقائق والمعلومات العلمية، بينما السردي يعتمد على الخيال والشخصيات والحبكة."}], "relatedExamId": "AR_Y6_WRITE_INFO"}, "Bt85LUKF2Xw": {"id": "Bt85LUKF2Xw", "title": "المفعول به وعلامات إعرابه", "subject": "اللغة العربية (نحو)", "grade": "الصف الخامس الابتدائي", "student": "Ali", "duration": "8 mins", "overview": "شرح مبسط وشامل للمفعول به في الجملة الفعلية للصف الخامس، مع جدول علامات الإعراب الثلاث: الفتحة، الكسرة، والياء.", "goldenRules": ["المفعول به: اسم منصوب يدل على من وقع عليه فعل الفاعل، ويكون جواباً عن سؤال: (ماذا فعل الفاعل؟).", "علامات إعراب المفعول به الثلاث:", "  1. الفتحة: إذا كان مفرداً (مثل: 'شرب الطفلُ الحليبَ') أو جمع تكسير (مثل: 'قرأ التلميذُ القصصَ').", "  2. الكسرة: إذا كان جمع مؤنث سالماً ينتهي بألف وتاء (مثل: 'كرّمت المديرةُ المعلماتِ').", "  3. الياء: إذا كان مثن amples": [{"sentence": "Why does a bulb turn OFF when a wire is cut or detached?", "analysis": "Because cutting the wire breaks the circuit, creating an OPEN circuit where electricity cannot jump the air gap."}], "quickCheck": [{"question": "Name two materials that can be used to complete a circuit and light a bulb.", "answer": "Copper wire, iron nail, or aluminum foil (any electrical conductor)."}, {"question": "Why is pure rubber used around household electrical plugs?", "answer": "Because rubber is an electrical insulator that protects humans from electric shock."}], "relatedExamId": "SCI_Y6_ELEC"}, "p3St51F4kE8": {"id": "p3St51F4kE8", "title": "Electricity & Energy Transformation", "subject": "العلوم / Science", "grade": "Year 5A", "student": "Ali", "duration": "6 mins", "overview": "How electrical energy is transformed into sound, kinetic, light, and heat energy in everyday devices.", "goldenRules": ["Law of Conservation of Energy: Energy cannot be created or destroyed; it only changes form.", "Transformations in Circuits:", "  - Electric Iron / Heater: Electrical energy -> Thermal (heat) energy.", "  - Electric Fan: Electrical energy -> Kinetic (motion) energy.", "  - Electric Bell / Buzzer: Electrical energy -> Sound energy.", "  - Light Bulb: Electrical energy -> Light and thermal energy."], "examples": [{"sentence": "What energy transformation occurs in a flashlight powered by a dry cell?", "analysis": "Chemical energy (in battery) -> Electrical energy (in circuit) -> Light + Heat energy (in bulb)."}], "quickCheck": [{"question": "What is the primary energy output of an electric toaster?", "answer": "Thermal (heat) energy."}], "relatedExamId": "SCI_Y5_ENERGY"}, "yuMiXt2I_xI": {"id": "yuMiXt2I_xI", "title": "Plant Transport vs. Human Circulation", "subject": "العلوم / Science", "grade": "Year 5A", "student": "Ali", "duration": "8 mins", "overview": "Comparing how water, minerals, and glucose move in plants through xylem and phloem, compared to blood flow in     function escapeHtml(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch];
      });
    }

    // Keep only the small formatting subset used by the question bank.
    function sanitizeRichText(value) {
      return String(value == null ? '' : value)
        .replace(/<(?!\/?(?:b|strong|u|i|em|br)\s*>)[^>]*>/gi, '');
    }

    function plainText(value) {
      return escapeHtml(String(value == null ? '' : value).replace(/<[^>]*>/g, ''));
    }

        if (!raw) return null;
        const saved = JSON.parse(raw);
        if (saved.sessionKey !== sessionKey) return null;
        if (!saved.savedAt || Date.now() - saved.savedAt > 3 * 60 * 60 * 1000) return null;
        return saved;
      } catch (e) {
        return null;
      }
    }

    function clearProgress() {
      try { safeStorage.removeItem(progressKey()); } catch (e) { /* ignore */ }
    }

    function showStatusError(message) {
      const statusBox = document.getElementById('sp-status-container');
      const actionBox = document.getElementById('sp-action-container');
      statusBox.innerHTML = `
        <div class="alert-box alert-danger">
          <span style="font-size: 1.2rem;">⚠️</span>
          <div>
            <strong>Could not load the assessment.</strong>
            <div style="font-size: 0.9rem; margin-top: 3px;">${escapeHtml(message || 'Connection error')}</div>
            <button type="button" class="btn-secondary" style="margin-top: 10px;" onclick="selectStudentExam(activeExamCode)">Try Again</button>
          </div>
        </div>
      `;
      actionBox.innerHTML = '';
    }

    window.addEventListener('beforeunload', function (event) {
      const quizScreen = document.getElementById('screen-quiz');
      if (quizScreen && quizScreen.classList.contains('active') && !isSubmitting && !examFinished) {
        event.preventDefault();
        event.returnValue = '';
      }
    });



    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      const target = document.getElementById(screenId);
      if (target) target.classList.add('active');

      // Unify Headers: Hide legacy top-header outside gateway so only 1 clean Coligo topbar is visible
      const legacyHeader = document.querySelector('.top-header');
      if (legacyHeader) {
        legacyHeader.style.display = (screenId === 'screen-gateway') ? 'flex' : 'none';
      }
      window.scrollTo(0, 0);
    }

    function returnToGateway() {
      if (typeof currentAdminToken !== 'undefined') {
        currentAdminToken = null;
      }
      showScreen('screen-gateway');
    }

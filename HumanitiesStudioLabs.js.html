  function renderConnectivesLab(container) {
    container.innerHTML =

        '</div>' +
        '<p style="font-size: 0.85rem; color: #64748b; margin-bottom: 12px;">Test coordinating (FANBOYS) versus subordinating connectives with positional commas.</p>' +
        '<div style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px;">' +
          '<button type="button" class="portal-btn btn-conj" data-c="Although" style="padding: 6px 12px; font-size: 0.82rem; background: #3b82f6; color: #fff;">Although (Sub)</button>' +
          '<button type="button" class="portal-btn btn-conj" data-c="Whereas" style="padding: 6px 12px; font-size: 0.82rem; background: #64748b; color: #fff;">Whereas (Sub)</button>' +
          '<button type="button" class="portal-btn btn-conj" data-c="but" style="padding: 6px 12px; font-size: 0.82rem; background: #64748b; color: #fff;">but (Coord)</button>' +
          '<button type="button" class="portal-btn btn-conj" data-c="Despite" style="padding: 6px 12px; font-size: 0.82rem; background: #64748b; color: #fff;">Despite (Prep)</button>' +
          '<button type="button" class="portal-btn btn-conj" data-c="so" style="padding: 6px 12px; font-size: 0.82rem; background: #64748b; color: #fff;">so (Coord)</button>' +
        '</div>' +
        '<div style="margin-bottom: 12px; display: flex; align-items: center; gap: 8px;">' +
          '<input type="checkbox" id="conj-front-toggle" checked style="width: 18px; height: 18px;">' +
          '<label for="conj-front-toggle" style="font-size: 0.85rem; font-weight: 700; color: #0f172a;">Front the Subordinate Clause (Start Sentence)</label>' +
        '</div>' +
        '<div style="background: #0f172a; color: #f8fafc; border-radius: 10px; padding: 14px;">' +
          '<div style="font-size: 0.75rem; text-transform: uppercase; color: #94a3b8; margin-bottom: 4px;">Assembled Sentence:</div>' +
          '<div id="conj-output-text" style="font-family: monospace; font-size: 0.95rem; color: #fbbf24;">Although it rained heavily, the football match continued.</div>' +
          '<div id="conj-rule-note" style="margin-top: 8px; font-size: 0.8rem; color: #4ade80;">✓ Subordinating conjunction at front requires a comma after the dependent clause.</div>' +
        '</div>' +
      '</div>';

    var activeConj = 'Although';
    function updateConj() {
      var isFront = document.getElementById('conj-front-toggle').checked;
      var out = document.getElementById('conj-output-text');
      var note = document.getElementById('conj-rule-note');

      if (activeConj === 'Although') {
        if (isFront) {
          out.textContent = 'Although it rained heavily, the football match continued.';
          note.textContent = '✓ Subordinating conjunction at front: comma separates dependent clause from independent clause.';
          note.style.color = '#4ade80';
        } else {
          out.textContent = 'The football match continued although it rained heavily.';
          note.textContent = '✓ Subordinating conjunction second: NO comma is normally used before although.';
          note.style.color = '#4ade80';
        }
      } else if (activeConj === 'Whereas') {
        if (isFront) {
          out.textContent = 'Whereas reptiles are cold-blooded, birds and mammals are warm-blooded.';
          note.textContent = '✓ Direct contrast conjunction at front: requires comma between contrast pairs.';
          note.style.color = '#4ade80';
        } else {
          out.textContent = 'Birds and mammals are warm-blooded, whereas reptiles are cold-blooded.';
          note.textContent = '✓ Whereas in second position still takes a comma in formal Cambridge style to mark direct contrast.';
          note.style.color = '#4ade80';
        }
      } else if (activeConj === 'but') {
        out.textContent = 'It rained heavily, but the football match continued.';
        note.textContent = '✓ Coordinating conjunction (FANBOYS): links two independent clauses with a comma before "but".';
        note.style.color = '#4ade80';
      } else if (activeConj === 'Despite') {
        out.textContent = 'Despite the heavy rain, the football match continued.';
        note.textContent = '✓ Despite is followed by a noun phrase ("the heavy rain"), not a finite verb clause!';
        note.style.color = '#4ade80';
      } else if (activeConj === 'so') {
        out.textContent = 'The battery was flat, so the lamp did not illuminate.';
        note.textContent = '✓ "So" expresses consequence in FANBOYS: comma precedes "so".';
        note.style.color = '#4ade80';
      }
    }

    container.querySelectorAll('.btn-conj').forEach(function(btn) {
      btn.onclick = function() {
        activeConj = btn.getAttribute('data-c');
        container.querySelectorAll('.btn-conj').forEach(function(b) {
          b.style.background = (b === btn) ? '#3b82f6' : '#64748b';
        });
        updateConj();
      };
    });
    document.getElementById('conj-front-toggle').onchange = updateConj;
  }

  /* =========================================================================
   * LAB 13: جدول التتبع التفاعلي وحاسبة مخرجات الحلقات (ICT 106)
   * ========================================================================= */
  function renderLoopsLab(container) {
    container.innerHTML = 
      '<div style="background: #ffffff; border: 1.5px solid #e2e8f0; border-radius: 14px; padding: 18px;">' +
        '<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">' +
          '<h4 style="margin: 0; font-size: 1.05rem; color: #0f172a; font-weight: 800;">🔄 جدول التتبع التفاعلي وحاسبة مخرجات الحلقات</h4>' +
          '<span style="font-size: 0.8rem; background: #fef3c7; color: #92400e; padding: 3px 10px; border-radius: 999px; font-weight: 700;">ICT 106</span>' +
        '</div>' +
        '<p style="font-size: 0.85rem; color: #64748b; margin-bottom: 12px;">شاهد تتبع قيم المتغيرات (Total و Count) في جدول التتبع خطوة بخطوة أثناء تكرار الحلقة.</p>' +
        '<div style="display: flex; gap: 8px; align-items: center; margin-bottom: 12px;">' +
          '<label style="font-size: 0.85rem; font-weight: 700;">كرر حتى N =</label>' +
          '<input type="number" id="loop-n-input" value="4" min="1" max="8" style="width: 70px; padding: 6px 10px; border: 1.5px solid #cbd5e1; border-radius: 8px;">' +
          '<button type="button" class="portal-btn" id="btn-run-loop-trace" style="padding: 6px 16px; font-size: 0.85rem; background: #3b82f6; color: #fff;">توليد جدول التتبع</button>' +
        '</div>' +
        '<div style="overflow-x: auto; margin-bottom: 12px;">' +
          '<table id="loop-trace-table" style="width: 100%; border-collapse: collapse; font-size: 0.85rem; text-align: center;">' +
            '<thead>' +
              '<tr style="background: #0f172a; color: #fff;">' +
                '<th style="padding: 8px; border: 1px solid #334155;">الخطوة (Step)</th>' +
                '<th style="padding: 8px; border: 1px solid #334155;">العداد (Count)</th>' +
                '<th style="padding: 8px; border: 1px solid #334155;">Total = Total + Count</th>' +
                '<th style="padding: 8px; border: 1px solid #334155;">شرط التكرار (Count &lt;= N)</th>' +
              '</tr>' +
            '</thead>' +
            '<tbody id="loop-trace-tbody"></tbody>' +
          '</table>' +
        '</div>' +
        '<div id="loop-final-val" style="background: #0f172a; color: #4ade80; padding: 10px; border-radius: 8px; font-weight: 700; font-size: 0.9rem; text-align: center;">القيمة النهائية للمجموع: Total = 10 بعد 4 دورات.</div>' +
      '</div>';

    function buildTrace() {
      var n = parseInt(document.getElementById('loop-n-input').value, 10) || 4;
      var tbody = document.getElementById('loop-trace-tbody');
      tbody.innerHTML = '';
      var total = 0;
      var rowsHtml = '<tr style="background: #f1f5f9;"><td style="padding: 6px; border: 1px solid #cbd5e1;">Initial</td><td style="padding: 6px; border: 1px solid #cbd5e1;">1</td><td style="padding: 6px; border: 1px solid #cbd5e1;">0</td><td style="padding: 6px; border: 1px solid #cbd5e1;">True</td></tr>';

      for (var c = 1; c <= n; c++) {
        total += c;
        rowsHtml += '<tr><td style="padding: 6px; border: 1px solid #cbd5e1;">دورة ' + c + '</td><td style="padding: 6px; border: 1px solid #cbd5e1; font-weight: 700;">' + c + '</td><td style="padding: 6px; border: 1px solid #cbd5e1; color: #2563eb; font-weight: 800;">' + total + '</td><td style="padding: 6px; border: 1px solid #cbd5e1; color: #16a34a;">True</td></tr>';
      }
      rowsHtml += '<tr style="background: #fee2e2;"><td style="padding: 6px; border: 1px solid #cbd5e1;">Exit</td><td style="padding: 6px; border: 1px solid #cbd5e1;">' + (n + 1) + '</td><td style="padding: 6px; border: 1px solid #cbd5e1; font-weight: 800;">' + total + '</td><td style="padding: 6px; border: 1px solid #cbd5e1; color: #dc2626; font-weight: 700;">False (توقف)</td></tr>';

      tbody.innerHTML = rowsHtml;
      document.getElementById('loop-final-val').textContent = 'القيمة النهائية للمجموع: Total = ' + total + ' بعد ' + n + ' دورات وتوقف العداد عند ' + (n + 1) + '.';
    }

    document.getElementById('btn-run-loop-trace').onclick = buildTrace;
    buildTrace();
  }

        '<div style="display: flex; gap: 8px; justify-content: center; margin-bottom: 12px;">' +

          '<button type="button" class="portal-btn" id="btn-sc-left" style="padding: 6px 14px; font-size: 0.82rem; background: #3b82f6; color: #fff;">⬅ Change X by -20</button>' +
          '<button type="button" class="portal-btn" id="btn-sc-right" style="padding: 6px 14px; font-size: 0.82rem; background: #3b82f6; color: #fff;">➡ Change X by +20</button>' +
          '<button type="button" class="portal-btn" id="btn-sc-reset" style="padding: 6px 14px; font-size: 0.82rem; background: #64748b; color: #fff;">إعادة للمنتصف (0, 0)</button>' +
        '</div>' +
        '<div style="position: relative; width: 100%; max-width: 360px; height: 220px; background: #f8fafc; border: 2px solid #0f172a; border-radius: 10px; margin: 0 auto 12px; overflow: hidden;">' +
          '<div style="position: absolute; left: 50%; top: 0; bottom: 0; width: 1.5px; background: #cbd5e1;"></div>' +
          '<div style="position: absolute; top: 50%; left: 0; right: 0; height: 1.5px; background: #cbd5e1;"></div>' +
          '<div style="position: absolute; right: 6px; top: 52%; font-size: 0.65rem; color: #94a3b8; font-weight: 700;">+240 X</div>' +
          '<div style="position: absolute; left: 6px; top: 52%; font-size: 0.65rem; color: #94a3b8; font-weight: 700;">-240 X</div>' +
          '<div style="position: absolute; left: 52%; top: 6px; font-size: 0.65rem; color: #94a3b8; font-weight: 700;">+180 Y</div>' +
          '<div style="position: absolute; left: 52%; bottom: 6px; font-size: 0.65rem; color: #94a3b8; font-weight: 700;">-180 Y</div>' +
          '<div id="scratch-cat-sprite" style="position: absolute; left: 165px; top: 95px; font-size: 2rem; transform: translate(-50%, -50%); transition: all 0.15s ease-out;">🐱</div>' +
        '</div>' +
        '<div style="background: #0f172a; color: #f8fafc; border-radius: 8px; padding: 10px; display: flex; justify-content: space-around; font-size: 0.95rem; font-weight: 800;">' +
          '<div>X: <span id="sc-x-val" style="color: #38bdf8;">0</span></div>' +
          '<div>Y: <span id="sc-y-val" style="color: #4ade80;">0</span></div>' +
        '</div>' +
      '</div>';

    var curX = 0;
    var curY = 0;
    function updateCat() {
      var sprite = document.getElementById('scratch-cat-sprite');
      var pxX = 180 + (curX * (180 / 240));
      var pxY = 110 - (curY * (110 / 180));
      sprite.style.left = pxX + 'px';
      sprite.style.top = pxY + 'px';
      document.getElementById('sc-x-val').textContent = curX;
      document.getElementById('sc-y-val').textContent = curY;
    }

    document.getElementById('btn-sc-up').onclick = function() { curY = Math.min(180, curY + 20); updateCat(); };
    document.getElementById('btn-sc-down').onclick = function() { curY = Math.max(-180, curY - 20); updateCat(); };
    document.getElementById('btn-sc-left').onclick = function() { curX = Math.max(-240, curX - 20); updateCat(); };
    document.getElementById('btn-sc-right').onclick = function() { curX = Math.min(240, curX + 20); updateCat(); };
    document.getElementById('btn-sc-reset').onclick = function() { curX = 0; curY = 0; updateCat(); };
  }

  function renderCyberSafetyLab(container) {
    container.innerHTML = 
      '<div style="background: #ffffff; border: 1.5px solid #e2e8f0; border-radius: 14px; padding: 18px;">' +
        '<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">' +
          '<h4 style="margin: 0; font-size: 1.05rem; color: #0f172a; font-weight: 800;">🛡️ فاحص قوة كلمات المرور ومكافح التصيد الاحتيالي</h4>' +
          '<span style="font-size: 0.8rem; background: #e0e7ff; color: #3730a3; padding: 3px 10px; border-radius: 999px; font-weight: 700;">ICT 105</span>' +
        '</div>' +
        '<p style="font-size: 0.85rem; color: #64748b; margin-bottom: 12px;">اختبر قوة كلمة المرور وفق المعايير الأربعة (طول 8+ خانات، أحرف كبيرة وصغيرة، أرقام، ورموز خاصة).</p>' +
        '<div style="margin-bottom: 12px;">' +
          '<input type="text" id="pwd-test-input" value="Falcon#98!Rocket" placeholder="اكتب كلمة مرور لتجربتها..." style="width: 100%; padding: 10px 14px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; font-family: monospace;">' +
        '</div>' +
        '<div style="height: 8px; background: #e2e8f0; border-radius: 999px; overflow: hidden; margin-bottom: 12px;">' +
          '<div id="pwd-strength-bar" style="height: 100%; width: 100%; background: #10b981; transition: all 0.3s;"></div>' +
        '</div>' +
        '<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-bottom: 12px;">' +
          '<div id="pw-c-len" style="padding: 6px; border-radius: 6px; font-size: 0.78rem; font-weight: 700; text-align: center;">8+ خانات</div>' +
          '<div id="pw-c-upper" style="padding: 6px; border-radius: 6px; font-size: 0.78rem; font-weight: 700; text-align: center;">حروف كبيرة (A-Z)</div>' +
          '<div id="pw-c-lower" style="padding: 6px; border-radius: 6px; font-size: 0.78rem; font-weight: 700; text-align: center;">حروف صغيرة (a-z)</div>' +
          '<div id="pw-c-num" style="padding: 6px; border-radius: 6px; font-size: 0.78rem; font-weight: 700; text-align: center;">أرقام (0-9)</div>' +
          '<div id="pw-c-sym" style="padding: 6px; border-radius: 6px; font-size: 0.78rem; font-weight: 700; text-align: center;">رموز (!@#$)</div>' +
        '</div>' +
        '<div id="pwd-rating-verdict" style="background: #0f172a; color: #4ade80; padding: 10px; border-radius: 8px; font-weight: 700; font-size: 0.88rem; text-align: center;">' +
          'درجة الأمان: كلمة مرور فولاذية ممتازة (صعبة الكسر والتخمين)!' +
        '</div>' +
      '</div>';

    function setP(id, ok) {
      var el = document.getElementById(id);
      if (!el) return;
      el.style.background = ok ? '#dcfce7' : '#fee2e2';
      el.style.color = ok ? '#14532d' : '#991b1b';
      el.textContent = (ok ? '✓ ' : '✗ ') + el.textContent.replace(/^[✓✗] /, '');
    }

    function testPwd() {
      var p = document.getElementById('pwd-test-input').value || '';
      var hasLen = p.length >= 8;
      var hasUpper = /[A-Z]/.test(p);
      var hasLower = /[a-z]/.test(p);
      var hasNum = /[0-9]/.test(p);
      var hasSym = /[^A-Za-z0-9]/.test(p);

      setP('pw-c-len', hasLen);
      setP('pw-c-upper', hasUpper);
      setP('pw-c-lower', hasLower);
      setP('pw-c-num', hasNum);
      setP('pw-c-sym', hasSym);

      var score = [hasLen, hasUpper, hasLower, hasNum, hasSym].filter(Boolean).length;
      var bar = document.getElementById('pwd-strength-bar');
      var verdict = document.getElementById('pwd-rating-verdict');

      bar.style.width = (score * 20) + '%';
      if (score >= 4) {
        bar.style.background = '#10b981';
        verdict.textContent = 'درجة الأمان: كلمة مرور فولاذية ممتازة (صعبة الكسر والتخمين)!';
        verdict.style.color = '#4ade80';
      } else if (score >= 2) {
        bar.style.background = '#f59e0b';
        verdict.textContent = 'درجة الأمان: كلمة مرور متوسطة - أضف رموزاً خاصة وأرقاماً لتقويتها.';
        verdict.style.color = '#facc15';
      } else {
        bar.style.background = '#ef4444';
        verdict.textContent = 'درجة الأمان: كلمة مرور ضعيفة جداً وسهلة الاختراق!';
        verdict.style.color = '#f87171';
      }
    }

    document.getElementById('pwd-test-input').oninput = testPwd;
    testPwd();
  }

            '</select>' +
          '</div>' +
        '</div>' +

            '<div id="env-verdict-badge" style="background: #065f46; color: #a7f3d0; padding: 3px 10px; border-radius: 999px; font-size: 0.8rem; font-weight: 700;">بيئة مستدامة ومقاومة للتصحر</div>' +

        '</div>' +

      var trees = parseInt(document.getElementById('env-tree-slider').value, 10);

      var score = trees;
      if (irr === 'drip') score += 30; else score -= 15;
      score = Math.max(10, Math.min(100, score));

      document.getElementById('env-index-val').textContent = score + ' / 100';

      }
    }

    document.getElementById('env-tree-slider').oninput = updateEnv;
    document.getElementById('env-irrigation-select').onchange = updateEnv;
    updateEnv();
  }

        '</div>' +
      '</div>';

    container.querySelectorAll('.btn-eg-border').forEach(function(btn) {
      btn.onclick = function() {
        var b = btn.getAttribute('data-b');
        container.querySelectorAll('.btn-eg-border').forEach(function(x) {
          x.style.background = (x === btn) ? '#3b82f6' : '#64748b';
        });
        var t = document.getElementById('eg-title');
        var d = document.getElementById('eg-desc');

        if (b === 'north') {
          t.textContent = 'الحد الشمالي: البحر المتوسط';
          d.textContent = 'حد طبيعي بحري يربط مصر بالقارة الأوروبية، وتطل عليه أقدم موانئ التجارة.';
        } else if (b === 'east') {
          t.textContent = 'الحد الشرقي: البحر الأحمر وشبه جزيرة سيناء';
          d.textContent = 'حد طبيعي بحري ممتد على البحر الأحمر وخليج العقبة، وحد بري مع فلسطين وبوابة العبور لآسيا.';
        } else if (b === 'south') {
          t.textContent = 'الحد الجنوبي: جمهورية السودان ومدار السرطان';
          d.textContent = 'حد بشري بري يمتد مع خط عرض 22° شمالاً، ويمر به مدار السرطان في جنوب مصر وشريان نهر النيل.';

          t.textContent = 'الحد الغربي: دولة ليبيا الشقيقة';

        } else if (b === 'suez') {
          t.textContent = 'قناة السويس وقناة السويس الجديدة (2015)';
          d.textContent = 'أهم ممر ملاحي في العالم، يربط الشرق بالغرب واختصر زمن رحلة عبور السفن من 20 إلى 11 ساعة.';
        }
      };
    });
  }

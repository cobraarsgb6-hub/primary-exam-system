name: Autonomous Cloud Coligo Ingestion

on:
  schedule:
    # Runs EVERY HOUR 24/7 (School days, weekends & holidays):
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Run Full Cloud Coligo Ingestion
      env:
        COLIGO_TOKEN: ${{ secrets.COLIGO_TOKEN }}
        COLIGO_USERNAME: ${{ secrets.COLIGO_USERNAME }}
        COLIGO_PASSWORD: ${{ secrets.COLIGO_PASSWORD }}
        GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
        SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
      run: |
        python cloud_coligo_sync.py

    - name: Commit & Push New Worksheets, Booklets & Catalogs
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add resources/coligo/
        # Never publish raw captured sessions or gradebook traffic (they can hold
        # tokens & family data). Publication-safe outputs are catalog + manifest
        # + material files (PDF/DOCX/extracted assets) only.
        git reset -- \
          "resources/coligo/local_storage.json" \
          "resources/coligo/captured_gradebook_api.json" \
          "resources/coligo/all_gradebook_traffic.json" \
          "resources/coligo/all_notifications.json" \
          "resources/coligo/live_grades_and_announcements.json" \
          "resources/coligo/all_curriculum_materials.json" \
          "resources/coligo/all_links_and_notes.json" \
          "resources/coligo/courses_dump.html" \
          "resources/coligo/api_resp_"*".json"
        git diff-index --quiet HEAD || git commit -m "chore(sync): automated hourly cloud coligo ingestion"
        git push || true

name: Autonomous Cloud Coligo Ingestion

on:
  schedule:
    # Runs EVERY HOUR 24/7 (School days, weekends & holidays):
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: coligo-sync-${{ github.ref }}
      cancel-in-progress: false

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Run Full Cloud Coligo Ingestion
      env:
        COLIGO_USERNAME: ${{ secrets.COLIGO_USERNAME }}
        COLIGO_PASSWORD: ${{ secrets.COLIGO_PASSWORD }}
        GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
        SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
      run: |
        python cloud_coligo_sync.py

    - name: Commit & Push New Worksheets, Booklets & Catalogs
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add resources/coligo/coligo_catalog.json resources/coligo/coligo_manifest.json resources/coligo/Ali resources/coligo/Mostafa
        # Never commit raw API/session/gradebook captures from the sync workspace.
        git reset -- \
          "resources/coligo/local_storage.json" \
          "resources/coligo/captured_gradebook_api.json" \
          "resources/coligo/all_gradebook_traffic.json" \
          "resources/coligo/all_notifications.json" \
          "resources/coligo/live_grades_and_announcements.json" \
          "resources/coligo/all_curriculum_materials.json" \
          "resources/coligo/all_links_and_notes.json" \
          "resources/coligo/courses_dump.html" \
          "resources/coligo/api_resp_"*".json"
        if ! git diff --cached --quiet; then
          git commit -m "chore(sync): automated hourly cloud coligo ingestion"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
          gh workflow run deploy-pages.yml --ref "$GITHUB_REF_NAME"
        else
          echo "No catalog or material changes to publish."
        fi

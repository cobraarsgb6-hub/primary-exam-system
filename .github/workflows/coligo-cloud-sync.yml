name: Daily Autonomous Coligo Sync

on:
  schedule:
    # Runs 7 days a week (including weekends and holidays) every 2 hours during active school & homework hours:
    # 7:00 AM, 9:00 AM, 11:00 AM, 1:00 PM, 3:00 PM, 5:00 PM, 7:00 PM, 9:00 PM, 11:00 PM Cairo Time (UTC 5,7,9,11,13,15,17,19,21)
    - cron: '0 5,7,9,11,13,15,17,19,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Run Full Cloud Coligo Ingestion
      env:
        COLIGO_TOKEN: ${{ secrets.COLIGO_TOKEN }}
        GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
        SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
      run: |
        python cloud_coligo_sync.py

    - name: Commit & Push New Worksheets, Booklets & Catalogs
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add resources/coligo/
        git diff-index --quiet HEAD || git commit -m "chore(sync): automated cloud coligo ingestion [skip ci]"
        git push || true

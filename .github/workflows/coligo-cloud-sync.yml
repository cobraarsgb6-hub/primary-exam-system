name: Autonomous Cloud Coligo Ingestion

on:
  schedule:
    # Runs EVERY HOUR 24/7 (School days, weekends & holidays):
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Run Full Cloud Coligo Ingestion
      env:
        COLIGO_TOKEN: ${{ secrets.COLIGO_TOKEN }}
        GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
        SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
      run: |
        python cloud_coligo_sync.py

    - name: Commit & Push New Worksheets, Booklets & Catalogs
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add resources/coligo/
        git diff-index --quiet HEAD || git commit -m "chore(sync): automated hourly cloud coligo ingestion [skip ci]"
        git push || true

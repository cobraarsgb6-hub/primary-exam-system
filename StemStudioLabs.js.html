  window.STEM_STUDIO_DATA = [{"id": "sci106_circulatory", "subjectCode": "Science 106", "student": "Mostafa", "unitNumber": 1, "title": "الجهاز الدوري والدورة الدموية المزدوجة", "titleEn": "Circulatory System: Heart, Blood Vessels & Double Circulation", "icon": "🫀", "videoId": "FgCBoZxBkDA", "relatedExamId": "DAILY_Y6_SCI_W1D1", "theory": {"overview": "الجهاز الدوري (Circulatory System) هو شبكة النقل الحيوية داخل جسم الإنسان، ويتكون من ثلاثة مكونات رئيسية: القلب (المضخة العضلية)، الأوعية الدموية (الشرايين، الأوردة، والشعيرات)، والدم. يمتلك الإنسان دورة دموية مزدوجة (Double Circulation)؛ حيث يمر الدم عبر القلب مرتين في كل دورة كاملة: الدورة الرئوية (Pulmonary Circulation) لنقل الدم غير المؤكسج إلى الرئتين لتحميل الأكسجين والتخلص من ثاني أكسيد الكربون، والدورة الجهازية (Systemic Circulation) لضخ الدم المؤكسج إلى كافة خلايا وأعضاء الجسم.", "goldenRules": ["القلب ينقسم طولياً إلى جانبين بواسطة حاجز (Septum) يمنع اختلاط الدم المؤكسج (الغني بـ O2) بالدم غير المؤكسج (الغني بـ CO2).", "الجانب الأيمن من القلب يتعامل حصرياً مع الدم غير المؤكسج (Deoxygenated Blood) ويضخه إلى الرئتين عبر الشريان الرئوي.", "الجانب الأيسر من القلب يحتوي على جدار عضلي أكثر سمكاً بثلاث مرات لأنه يضخ الدم المؤكسج تحت ضغط عالٍ لكافة أجزاء الجسم عبر الأورطي (Aorta).", "الشرايين (Arteries) تنقل الدم بعيداً عن القلب وتمتلك جدراناً عضلية سميكة ومرنة لتتحمل الضغط العالي.", "الأوردة (Veins) تعيد الدم إلى القلب وتمتلك صمامات (Valves) تمنع رجوع الدم للخلف بفعل الجاذبية.", "الشعيرات الدموية (Capillaries) جدرانها رقيقة جداً (خلية واحدة سمكاً) للسماح بتبادل الغازات والمغذيات بالانتشار (Diffusion)."], "workedExamples": [{"concept": "مسار تدفق الدم عبر حجرات القلب الأربعة", "explanation": "يدخل الدم غير المؤكسج من الجسم عبر الوريدين الأجوفين إلى الأذين الأيمن (Right Atrium) ➔ ينقبض ليمر الدم عبر الصمام ثلاثي الشرفات إلى البطين الأيمن (Right Ventricle) ➔ يُضخ الدم عبر الشريان الرئوي إلى الرئتين للأكسجة ➔ يعود الدم المؤكسج عبر الأوردة الرئوية إلى الأذين الأيسر (Left Atrium) ➔ يمر إلى البطين الأيسر (Left Ventricle) ➔ يُضخ بقوة عبر الأبهر (Aorta) لكامل الجسم."}, {"concept": "تأثير التمارين الرياضية على معدل النبض", "explanation": "أثناء ممارسة الرياضة، تحتاج العضلات إلى كميات أكبر من الأكسجين والجلوكوز لإنتاج الطاقة عبر التنفس الخلوي، مما يدفع القلب إلى زيادة معدل النبض (Pulse Rate) وسرعة ضخ الدم لتلبية هذا الطلب وطرد الفضلات وثاني أكسيد الكربون."}], "examTraps": ["فخ الشريان الرئوي: جميع الشرايين تحمل دماً مؤكسجاً ما عدا الشريان الرئوي (Pulmonary Artery) فهو الشريان الوحيد الذي يحمل دماً غير مؤكسج.", "فخ الصمامات: الأوردة فقط هي التي تمتلك صمامات جيبية لمنع الرجوع؛ الشرايين لا تحتاج صمامات لأن الدم يندفع فيها بضغط قوي مستمر من نبض القلب."]}, "flashcards": [{"id": 1, "front": "ما هي المكونات الثلاثة الرئيسية للجهاز الدوري؟", "back": "القلب (المضخة)، الأوعية الدموية (المسارات)، والدم (سائل النقل).", "tip": "فكر في مضخة وأنابيب وسائل."}, {"id": 2, "front": "لماذا جدار البطين الأيسر أكثر سمكاً من البطين الأيمن؟", "back": "لأنه يحتاج إلى توليد ضغط دم مرتفع جداً لضخ الدم إلى جميع أنحاء الجسم، بينما الأيمن يضخ للرئتين فقط القريبتين من القلب.", "tip": "المسافة أطول تتطلب ضغطاً أكبر."}, {"id": 3, "front": "ما وظيفة الصمامات (Valves) داخل القلب والأوردة؟", "back": "ضمان تدفق الدم في اتجاه واحد فقط ومنع رجوعه إلى الوراء.", "tip": "تعمل مثل الباب أحادي الاتجاه."}, {"id": 4, "front": "ما الوعاء الدموي الذي ينقل الدم غير المؤكسج من القلب إلى الرئتين؟", "back": "الشريان الرئوي (Pulmonary Artery).", "tip": "يبدأ بحرف الشين لأنه يخرج من القلب."}, {"id": 5, "front": "كيف تتكيف الشعيرات الدموية لأداء وظيفة تبادل الغازات؟", "back": "جدرانها رقيقة جداً تتكون من طبقة خلوية واحدة مجهرية لتقليل مسافة الانتشار.", "tip": "سمك خلية واحدة فقط."}, {"id": 6, "front": "ما المقصود بالدورة الدموية المزدوجة؟", "back": "يمر الدم عبر القلب مرتين ليكمل دورة واحدة كاملة: دورة رئوية ودورة جهازية.", "tip": "Double Circulation."}, {"id": 7, "front": "ما هو الوعاء الدموي الرئيسي الذي يوزع الدم المؤكسج على الجسم بأكمله؟", "back": "الشريان الأورطي أو الأبهر (Aorta).", "tip": "أكبر شريان في جسم الإنسان."}, {"id": 8, "front": "لماذا تمتلك الشرايين جدراناً عضلية سميكة ومرنة؟", "back": "لتتحمل الضغط العالي للدم المندفع مباشرة من انقباض البطينين دون أن تتمزق.", "tip": "ضغط دم مرتفع ونبضي."}, {"id": 9, "front": "ماذا يحدث لمعدل نبضات القلب بعد انتهاء ممارسة الرياضة مباشرة؟", "back": "ينخفض تدريجياً ليعود إلى المعدل الطبيعي أثناء الراحة (Resting Heart Rate) مع تخلص الجسم من حمض اللاكتيك وسداد دَين الأكسجين.", "tip": "مؤشر Recovery Time."}, {"id": 10, "front": "ما الغاز الذي يتم امتصاصه في الرئتين وما الغاز الذي يتم التخلص منه؟", "back": "يُمتص الأكسجين (O2) في الحويصلات الهوائية ويُطرد ثاني أكسيد الكربون (CO2).", "tip": "تبادل الغازات التنفسية."}]}, {"id": "sci106_forces", "subjectCode": "Science 106", "student": "Mostafa", "unitNumber": 2, "title": "القوى والاحتكاك ومقاومة الهواء والمظلات", "titleEn": "Forces, Friction & Air Resistance: Parachute Physics", "icon": "🪂", "videoId": "FgCBoZxBkDA", "relatedExamId": "DAILY_Y6_SCI_W1D1", "theory": {"overview": "القوة (Force) هي سحب أو دفع يؤثر على جسم ما ويقاس بوحدة النيوتن (N) باستخدام الميزان الزنبركي (Force Meter). عند سقوط أي جسم نحو الأرض، يخضع لقوة الجاذبية (Weight/Gravity) التي تسحبه لأسفل نحو مركز الأرض. وفي المقابل، تحتك جزيئات الهواء بسطح الجسم المتحرك لتولّد قوة مقاومة الهواء (Air Resistance/Drag) التي تؤثر لأعلى ضد اتجاه الحركة. عندما تتساوى مقاومة الهواء مع وزن الجسم، تصبح القوى متزنة (Balanced Forces) ويصل الجسم إلى سرعته القصوى الثابتة وتسمى السرعة النهائية (Terminal Velocity).", "goldenRules": ["الوزن (Weight) = الكتلة (Mass بالـ kg) × تسارع الجاذبية (نحو 10 N/kg على كوكب الأرض).", "مقاومة الهواء هي شكل من أشكال قوى الاحتكاك (Friction) وتعتمد مباشرة على: مساحة سطح الجسم وسرعة حركته وشكله الانسيابي.", "كلما زادت مساحة سطح المظلة (Canopy Area)، زاد اصطدامها بجزيئات الهواء، مما يرفع مقاومة الهواء ويقلل السرعة النهائية للهبوط بأمان.", "القوى المتزنة (Balanced Forces): محصلة القوى صفر، فيتحرك الجسم بسرعة ثابتة أو يبقى ساكناً.", "القوى غير المتزنة (Unbalanced Forces): تسبب تسارع الجسم (Acceleration) أو تباطؤه أو تغير اتجاهه."], "workedExamples": [{"concept": "مراحل هبوط مظلي من الطائرة", "explanation": "1. لحظة القفز: مقاومة الهواء = صفر، والوزن يسحبه لأسفل ➔ يتسارع بسرعة كبيرة.\n2. مع زيادة السرعة: تزداد مقاومة الهواء تدريجياً حتى تتساوى مع الوزن ➔ يصل للسرعة النهائية الأولى (~200 كم/س).\n3. عند فتح المظلة: تزداد مساحة السطح فجأة فتصبح مقاومة الهواء أكبر بكثير من الوزن ➔ يتباطأ المظلي بسرعة.\n4. بعد التباطؤ: تقل مقاومة الهواء حتى تتعادل مجدداً مع الوزن ➔ سرعة نهائية آمنة (~15 كم/س) للهبوط على الأرض."}], "examTraps": ["فخ الكتلة والوزن: الكتلة (Mass) ثابتة وتقاس بالكيلوجرام (kg) ولا تتغير بتغير المكان، بينما الوزن (Weight) قوة تقاس بالنيوتن وتعتمد على جاذبية الكوكب.", "فخ صعود المظلي: فتح المظلة لا يدفع المظلي إلى الأعلى في الحقيقة، بل يجعله يتباطأ بسرعة بينما تستمر الكاميرا في السقوط السريع فيبدو وكأنه ارتفع!"]}, "flashcards": [{"id": 1, "front": "ما هي وحدة قياس القوة في النظام الدولي؟", "back": "النيوتن (Newton) ورمزها N.", "tip": "سُميت تيمناً بإسحاق نيوتن."}, {"id": 2, "front": "ما الجهاز المستخدم لقياس القوة في المعمل المدرسي؟", "back": "الميزان الزنبركي أو مقياس القوة (Force Meter / Newton Meter).", "tip": "يحتوي على زنبرك يتمدد."}, {"id": 3, "front": "ما العاملان اللذان يزيدان من مقدار قوة مقاومة الهواء لمظلة؟", "back": "زيادة مساحة سطح المظلة وزيادة سرعة حركتها.", "tip": "مساحة أكبر وسرعة أعلى."}, {"id": 4, "front": "ماذا نطلق على الحالة التي تتساوى فيها مقاومة الهواء لأعلى مع وزن الجسم لأسفل؟", "back": "السرعة النهائية (Terminal Velocity).", "tip": "سرعة قصوى ثابتة."}, {"id": 5, "front": "إذا كانت القوى المؤثرة على سيارة متزنة تماماً، فماذا يحدث لحركتها؟", "back": "تسير السيارة بسرعة ثابتة في خط مستقيم دون أي تسارع.", "tip": "قانون نيوتن الأول."}, {"id": 6, "front": "ما هو اتجاه قوة الاحتكاك دائماً بالنسبة لاتجاه الحركة؟", "back": "في الاتجاه المعاكس تماماً لاتجاه حركة الجسم.", "tip": "تقاوم الانزلاق دائماً."}, {"id": 7, "front": "كيف تقلل الطائرات والسيارات السريعة من مقاومة الهواء؟", "back": "عبر التصميم الانسيابي الهوائي (Streamlined Aerodynamic Shape) لتقليل الاصطدام بالهواء.", "tip": "مثل شكل الدلفين والصقر."}, {"id": 8, "front": "ما الفرق الجوهري بين الكتلة (Mass) والوزن (Weight)؟", "back": "الكتلة كمية المادة في الجسم (kg)، والوزن قوة جذب الأرض للجسم (N).", "tip": "الكتلة لا تتغير على القمر."}, {"id": 9, "front": "لماذا يسقط ريشة ومطرقة بنفس السرعة على سطح القمر؟", "back": "لعدم وجود غلاف جوي على القمر، وبالتالي تنعدم مقاومة الهواء تماماً فتسقط الأجسام بنفس التسارع الجاذبي.", "tip": "تجربة أبولو الشهيرة."}, {"id": 10, "front": "إذا كان وزن مظلي 700 نيوتن، فكم تبلغ مقاومة الهواء عند سرعته النهائية؟", "back": "700 نيوتن تماماً ولكن في الاتجاه المعاكس (لأعلى) لتتزن القوى.", "tip": "محصلة القوى = صفر."}]}, {"id": "sci106_circuits", "subjectCode": "Science 106", "student": "Mostafa", "unitNumber": 3, "title": "معمل الكهرباء والدوائر والتوصيل المتكامل", "titleEn": "Electric Circuits: Series/Parallel & Conduction Mastery", "icon": "⚡", "videoId": "FgCBoZxBkDA", "relatedExamId": "DAILY_Y6_SCI_W1D1", "theory": {"overview": "الدائرة الكهربائية (Electric Circuit) هي مسار مغلق ومستمر تتدفق عبره الشحنات الكهربائية (الإلكترونات). تتكون الدائرة البسيطة من: مصدر جهد (خلية أو بطارية توفر قوة الدفع الكهربائي)، أسلاك موصلة، حمل كهربائي (مصباح أو محرك)، ومفتاح للتحكم في فتح وإغلاق المسار. تنقسم المواد حسب توصيلها إلى: موصلات (Conductors) تسمح بسريان التيار بسهولة لاحتوائها على إلكترونات حرة كالمعادن والجرافيت، وعوازل (Insulators) تمنع سريان التيار كالخشب والبلاستيك والمطاط والزجاج.", "goldenRules": ["يجب أن تكون الدائرة مغلقة بالكامل (Complete Circuit) وبدون أي فجوة لكي يضيء المصباح.", "في دائرة التوالي (Series Circuit): يوجد مسار واحد فقط؛ إذا تلف أو فُك مصباح واحد تنطفئ جميع المصابيح، وكلما زدنا المصابيح تقل إضاءتها.", "في دائرة التوازي (Parallel Circuit): توجد مسارات متفرعة؛ إذا انطفأ مصباح تظل المصابيح الأخرى مضيئة بكامل قوتها.", "زيادة عدد الخلايا الكهربائية يزيد فرق الجهد (Voltage) مما يرفع شدة التيار ويزيد سطوع المصباح.", "الجرافيت (سن قلم الرصاص) مادة لا فلزية لكنها موصلة ممتازة للكهرباء لاحتوائها على إلكترونات حرة غير متمركزة."], "workedExamples": [{"concept": "مقارنة عملية بين دائرة توالي ودائرة توازي", "explanation": "دائرة توالي ببطارية ومصباحين: يتوزع الجهد ➔ كل مصباح يحصل على نصف الجهد فيكون خافتاً.\nدائرة توازي ببطارية ومصباحين: كل مصباح متصل بفرع مستقل ➔ يحصل كل مصباح على الجهد الكامل ويكون شديد السطوع."}], "examTraps": ["فخ المفتاح المفتوح: المفتاح المفتوح (Open Switch) يعني دائرة مقطوعة ➔ لا يمر تيار. المفتاح المغلق (Closed Switch) يكمل المسار ➔ يمر التيار.", "فخ ماس الدائرة (Short Circuit): إذا اتصل طرفا البطارية بسلك موصل بدون حمل ينشأ ماس كهربائي خطير ترتفع فيه الحرارة وتفرغ البطارية فوراً."]}, "flashcards": [{"id": 1, "front": "ما الشرط الأساسي لسريان التيار الكهربائي في أي دائرة؟", "back": "أن تكون الدائرة مغلقة بالكامل (Complete Loop) بدون أي قطع أو مفتاح مفتوح.", "tip": "مسار مغلق مستمر."}, {"id": 2, "front": "ما هي المادة اللافلزية الوحيدة الشائعة التي توصل الكهرباء؟", "back": "الجرافيت (Graphite) وهو صورة من صور الكربون المستخدم في سنون أقلام الرصاص.", "tip": "الكربون في أقلام الرصاص."}, {"id": 3, "front": "ماذا يحدث للمصابيح الأخرى في دائرة توالي إذا احترق أحد المصابيح؟", "back": "تنطفئ جميع المصابيح فوراً لأن الدائرة أصبحت مفتوحة وغير مكتملة.", "tip": "مسار واحد فقط يربط الجميع."}, {"id": 4, "front": "لماذا تُوصل أضواء المنازل على التوازي وليس على التوالي؟", "back": "لكي يمكن تشغيل وإطفاء كل جهاز بمفرده، وإذا تعطل جهاز لا تنطفئ باقي الأجهزة في المنزل.", "tip": "استقلالية كل جهاز."}, {"id": 5, "front": "ما تأثير إضافة بطارية إضافية موصلة بالاتجاه الصحيح لدائرة بسيطة؟", "back": "يزداد فرق الجهد (Voltage) وبالتالي يتدفق تيار أكبر ويزداد سطوع المصباح.", "tip": "مزيد من طاقة الدفع."}, {"id": 6, "front": "اذكر ثلاثة أمثلة على مواد عازلة للكهرباء (Electrical Insulators).", "back": "المطاط، البلاستيك، والخشب الجاف (أو الزجاج).", "tip": "لا تحتوي إلكترونات حرة."}, {"id": 7, "front": "ما وظيفة الغلاف البلاستيكي المحيط بأسلاك النحاس الكهربائية؟", "back": "عزل السلك وحماية المستخدم من الصدمات الكهربائية ومنع حدوث ماس بين الأسلاك.", "tip": "الأمان والسلامة أولاً."}, {"id": 8, "front": "ماذا يحدث إذا تم توصيل قطبي بطارية بسلك مباشر دون أي مصباح؟", "back": "تحدث قفلة كهربائية (Short Circuit)، فيسري تيار هائل وتفرغ البطارية وتسخن الأسلاك بشدة.", "tip": "ماس كهربائي خطير."}, {"id": 9, "front": "ما هو الرمز العلمي للخلية الكهربائية في مخططات الدوائر؟", "back": "خط طويل رفيع يمثل القطب الموجب (+) يوازيه خط قصير وسميك يمثل القطب السالب (-).", "tip": "خطان متوازيان غير متساويين."}, {"id": 10, "front": "ما هي الجسيمات دون الذرية المسؤولة عن نقل التيار في الأسلاك المعدنية؟", "back": "الإلكترونات الحرة (Free Electrons) سالبة الشحنة.", "tip": "تدور حول نواة الذرة."}]}, {"id": "sci106_mixtures", "subjectCode": "Science 106", "student": "Mostafa", "unitNumber": 4, "title": "فصل المخاليط والمحاليل بالترشيح والتبخير", "titleEn": "Mixtures, Solutions & Separation Techniques", "icon": "🧪", "videoId": "", "relatedExamId": "DAILY_Y6_SCI_W1D1", "theory": {"overview": "المخلوط (Mixture) يتكون من مادتين أو أكثر ممتزجتين معاً فيزيائياً دون حدوث تفاعل كيميائي، مع احتفاظ كل مادة بخواصها الأصلية ويمكن فصلها بالوسائل الفيزيائية. والمحلول (Solution) هو مخلوط متجانس ينتج عن ذوبان مادة صلبة تسمى المذاب (Solute) داخل سائل يسمى المذيب (Solvent). نختار طريقة الفصل بناءً على الخصائص الفيزيائية للمكونات: الترشيح (Filtration) لفصل مادة صلبة غير ذائبة عن السائل، والتبخير أو التبلور (Evaporation/Crystallization) لاستعادة المذاب من المحلول، والفصل المغناطيسي للحديد.", "goldenRules": ["المذاب (Solute): المادة التي تذوب (مثل الملح أو السكر). المذيب (Solvent): السائل الذي يذيب المادة (مثل الماء).", "المحلول المشبع (Saturated Solution): محلول لا يستطيع إذابة أي كمية إضافية من المذاب عند درجة حرارة معينة.", "الترشيح (Filtration): يحتجز المادة الصلبة غير الذائبة على ورقة الترشيح وتسمى الراسب (Residue)، بينما يمر السائل النقي ويسمى الرشيح (Filtrate).", "التبخير (Evaporation): يفصل الملح الذائب؛ حيث يتحول الماء إلى بخار ويتطاير بينما تترسب بلورات الملح الصلبة.", "التقطير (Distillation): يُستخدم عندما نريد استعادة السائل المذيب (الماء النقي) وليس الملح فقط عبر الغليان ثم التكثيف."], "workedExamples": [{"concept": "خطة فصل خليط معقد من: رمل + ملح طعام + برادة حديد", "explanation": "الخطوة 1: استخدام المغناطيس لجذب وفصل برادة الحديد بالكامل.\nالخطوة 2: إضافة الماء إلى المتبقي وتقليبه جيداً حتى يذوب الملح تماماً ويبقى الرمل معلقاً.\nالخطوة 3: صب الخليط عبر قمع به ورقة ترشيح ➔ يستقر الرمل كورقة ترشيح (راسب)، ويمر ماء الملح كرشيح.\nالخطوة 4: تسخين ماء الملح على موقد بنسن ➔ يتبخر الماء وتبقى بلورات ملح الطعام النقية."}], "examTraps": ["فخ ترشيح المحلول: لا يمكن فصل الملح الذائب في الماء بالترشيح لأن جزيئات المذاب صغيرة جداً تمر بسهولة عبر مسام ورقة الترشيح.", "فخ فقدان الكتلة: عند ذوبان 10 جرام ملح في 100 جرام ماء، تكون كتلة المحلول 110 جرام بالضبط لأن الذوبان لا يدمر المادة."]}, "flashcards": [{"id": 1, "front": "ما الفرق بين المذاب (Solute) والمذيب (Solvent)؟", "back": "المذاب هو المادة التي تذوب (مثل الملح)، والمذيب هو السائل الذي يذوب فيه المذاب (مثل الماء).", "tip": "الملح مذاب، الماء مذيب."}, {"id": 2, "front": "ما الطريقة الأنسب لفصل الرمل غير الذائب عن الماء؟", "back": "طريقة الترشيح (Filtration) باستخدام قمع وورقة ترشيح.", "tip": "ورقة الترشيح تحجز المواد الصلبة."}, {"id": 3, "front": "ماذا نطلق على المادة الصلبة التي تتبقى فوق ورقة الترشيح بعد انتهاء العملية؟", "back": "الراسب أو المتبقي (Residue).", "tip": "المادة المحتجزة."}, {"id": 4, "front": "ماذا نطلق على السائل الصافي الذي يمر عبر ورقة الترشيح إلى الدورق؟", "back": "الرشيح (Filtrate).", "tip": "السائل المترشح."}, {"id": 5, "front": "كيف يمكننا استرجاع ملح الطعام الذائب في الماء؟", "back": "بالتبخير (Evaporation) أو التبلور بتسخين المحلول حتى يتبخر الماء وتتبقى البلورات.", "tip": "حرارة تبخر السائل."}, {"id": 6, "front": "ما الخاصية الفيزيائية المستخدمة لفصل برادة الحديد عن الكبريت أو الرمل؟", "back": "الخاصية المغناطيسية (Magnetic Attraction)؛ الحديد ينجذب للمغناطيس بينما الرمل لا ينجذب.", "tip": "استخدم قضيب مغناطيس."}, {"id": 7, "front": "ما هو المحلول المشبع (Saturated Solution)؟", "back": "محلول يحتوي على أقصى كمية ممكنة من المذاب ولا يمكنه إذابة المزيد عند نفس درجة الحرارة.", "tip": "لا يقبل ذوبان ذرة إضافية."}, {"id": 8, "front": "كيف تؤثر زيادة درجة الحرارة على سرعة وكمية ذوبان المواد الصلبة في الماء؟", "back": "تزيد من سرعة الذوبان وترفع الحد الأقصى لكمية المذاب الذائبة في المحلول.", "tip": "الشاي الساخن يذيب سكراً أكثر."}, {"id": 9, "front": "إذا أردنا الحصول على الماء النقي الصالح للشرب من ماء البحر المالح، فما الطريقة؟", "back": "التقطير البسيط (Distillation) لغلي الماء وتكثيف بخاره في مبرد منفصل.", "tip": "تبخير يعقبه تكثيف."}, {"id": 10, "front": "هل يُعد ذوبان السكر في الماء تغيراً كيميائياً أم فيزيائياً؟ ولماذا؟", "back": "تغير فيزيائي لأن جزيئات السكر لم تتغير كيميائياً ويمكن استرجاع السكر بتبخير الماء.", "tip": "عملية انعكاسية قابلة للعكس."}]}, {"id": "sci106_changes", "subjectCode": "Science 106", "student": "Mostafa", "unitNumber": 5, "title": "التغيرات الفيزيائية والكيميائية العكسية وغير العكسية", "titleEn": "Reversible vs Irreversible Changes & Chemical Reactions", "icon": "🔥", "videoId": "", "relatedExamId": "DAILY_Y6_SCI_W1D1", "theory": {"overview": "تخضع المواد لنوعين من التغيرات: 1. التغيرات الفيزيائية (Physical Changes): هي تغيرات تؤثر فقط في الحالة أو الشكل أو الحجم دون تكوين أي مادة جديدة، وغالباً ما تكون انعكاسية (Reversible) مثل: الانصهار، التجمد، التبخر، التكثف، والذوبان. 2. التغيرات الكيميائية (Chemical Changes): هي تفاعلات تعيد ترتيب الذرات لإنتاج مواد جديدة تماماً بخواص مختلفة كلياً، وغالباً ما تكون غير انعكاسية (Irreversible) مثل: الاحتراق، الصدأ، فساد الأطعمة، وتفاعل الأحماض مع الكربونات. أدلة حدوث التغير الكيميائي تشمل: تغير اللون، تصاعد فقاعات غاز، انبعاث ضوء أو حرارة، أو تكوين راسب غير ذائب.", "goldenRules": ["التغير الفيزيائي انعكاسي (Reversible): يمكن استرجاع المادة الأصلية بسهولة بتغيير درجة الحرارة أو التبخير.", "التغير الكيميائي غير انعكاسي (Irreversible): لا يمكن استرجاع المواد الأصلية بالوسائل الفيزيائية العادية لأن روابط جديدة تشكلت.", "قانون حفظ الكتلة: في أي تغير كيميائي أو فيزيائي مغلق، الكتلة الكلية للمواد المتفاعلة = الكتلة الكلية للمواد الناتجة.", "تفاعل الخل (حمض الأسيتيك) مع بيكربونات الصوديوم يطلق غاز ثاني أكسيد الكربون (CO2) ويخفض درجة الحرارة (ماص للحرارة).", "الصدأ (Rusting) تغير كيميائي يتطلب وجود عنصرين معاً: الأكسجين والماء على سطح الحديد."], "workedExamples": [{"concept": "تصنيف التغيرات: شمعة تشتعل وتذوب", "explanation": "شمعة تشتعل: انصهار شمع البارافين السائل وتحوله لصلب عند تبريده هو تغير فيزيائي انعكاسي. أما احتراق فتيل الشمعة وتصاعد الدخان وثاني أكسيد الكربون فهو تغير كيميائي غير انعكاسي لا يمكن إعادته."}], "examTraps": ["فخ احتراق الورق: تحول الورق إلى رماد ينتج غازات طارت في الهواء، فلا تظن أن الكتلة نقصت؛ لو وزنت الغازات والرماد لكانت مساوية تماماً لكتلة الورقة والأكسجين المتفاعل.", "فخ الطهي: طهي البيض يغير شكل بروتيناته بصورة دائمة، لذا فهو تغير كيميائي غير انعكاسي تماماً."]}, "flashcards": [{"id": 1, "front": "ما هو الدليل القاطع على حدوث تغير كيميائي وليس فيزيائياً؟", "back": "تكوين مادة جديدة تماماً تمتلك خواص كيميائية وفيزيائية مختلفة عن المواد الأصلية.", "tip": "ظهور مادة جديدة."}, {"id": 2, "front": "صنّف: انصهار الشوكولاتة في يد الطفل (فيزيائي أم كيميائي)؟", "back": "تغير فيزيائي انعكاسي، لأن وضعها في الثلاجة يعيدها إلى الحالة الصلبة دون تغيير طعمها أو تركيبها.", "tip": "تغير حالة مادة فقط."}, {"id": 3, "front": "ما هي الأدلة الحسية الأربعة التي قد تشير إلى حدوث تفاعل كيميائي؟", "back": "1. تصاعد فقاعات غاز، 2. تغير دائم في اللون، 3. انطلاق أو امتصاص حرارة/ضوء، 4. تكوين راسب صلب.", "tip": "غاز، لون، حرارة، راسب."}, {"id": 4, "front": "ما المادتان الأساسيتان اللازمتان لحدوث صدأ الحديد؟", "back": "الأكسجين (من الهواء) والماء (أو الرطوبة).", "tip": "الحديد الجاف لا يصدأ."}, {"id": 5, "front": "ما هو الغاز المتصاعد عند إضافة الخل إلى مسحوق الخبيز (Baking Soda)؟", "back": "غاز ثاني أكسيد الكربون (Carbon Dioxide - CO2).", "tip": "يطفئ لهب الشمعة."}, {"id": 6, "front": "صنّف: صدأ مسامير الحديد في الحديقة (انعكاسي أم غير انعكاسي)؟", "back": "غير انعكاسي (Irreversible) وتغير كيميائي دائم لتكون أكسيد الحديد.", "tip": "لا يمكن نزع الصدأ ليعود حديداً."}, {"id": 7, "front": "ماذا ينص قانون حفظ الكتلة في التفاعلات الكيميائية؟", "back": "المادة لا تفنى ولا تستحدث، ومجموع كتل المواد المتفاعلة يساوي تماماً مجموع كتل المواد الناتجة.", "tip": "الكتلة تظل ثابتة."}, {"id": 8, "front": "لماذا يُعد احتراق الخشب تغيراً غير انعكاسي؟", "back": "لأنه يحول الخشب والأكسجين إلى رماد وثاني أكسيد كربون وبخار ماء، ولا يمكن جمعها لإعادة صنع الخشب.", "tip": "طاقة ومواد جديدة."}, {"id": 9, "front": "هل غليان الماء وتحوله إلى بخار تغير كيميائي؟ ولماذا؟", "back": "لا، هو تغير فيزيائي انعكاسي لأن البخار لا يزال جزيئات ماء (H2O) وسيتكثف بالتبريد إلى ماء سائل.", "tip": "تغير حالة فيزيائية."}, {"id": 10, "front": "كيف نمنع صدأ هياكل السيارات والجسور الحديدية؟", "back": "بطلائها بالدهانات أو الجلفنة بطبقة من الزنك أو تشحيمها لعزلها عن الهواء والرطوبة.", "tip": "طبقة عازلة واقية."}]}, {"id": "sci106_measurements", "subjectCode": "Science 106", "student": "Mostafa", "unitNumber": 6, "title": "القياسات المعملية وقراءة التدريج والحرارة", "titleEn": "Scientific Measurements & Investigation: Scales, Meniscus & Thermometers", "icon": "📐", "videoId": "", "relatedExamId": "DAILY_Y6_SCI_W1D1", "theory": {"overview": "التجربة العلمية المنضبطة تعتمد على القياس الدقيق (Accuracy) والتحكم في المتغيرات (Fair Testing). في قياس حجم السوائل باستخدام المخبار المدرج (Graduated Cylinder)، ينحني سطح السائل مشكلاً ما يسمى بالسطح الهلالي أو التقعر (Meniscus). القاعدة الذهبية هي: وضع المخبار على سطح مستوٍ تماماً، وجعل العين في نفس المستوى الأفقي مع سطح السائل، وقراءة القيمة عند أسفل القوس المقعر (Bottom of the Meniscus). وفي مقاييس الحرارة (Thermometers)، نراقب تمدد الكحول أو الزئبق بالحرارة وانكماشه بالبرودة مع الانتباه لقيمة كل شرطة تدريج.", "goldenRules": ["قراءة السطح الهلالي (Meniscus): تؤخذ القراءة دائماً عند قاع القوس المقعر مع وضع العين على مستوى أفقي مباشر لتفادي خطأ زاوية الرؤية (Parallax Error).", "تحديد قيمة قسمة التدريج (Scale Interval): احسب الفرق بين رقمين رئيسيين واقسمه على عدد الأقسام بينهما قبل القراءة.", "المتغير المستقل (Independent Variable): هو العامل الوحيد الذي يغيره الباحث عمداً في التجربة.", "المتغير التابع (Dependent Variable): هو العامل الذي نقيسه ونسجله لمعرفة نتيجة التجربة.", "المتغيرات الثابتة (Controlled Variables): هي جميع العوامل الأخرى التي يجب تثبيتها لضمان عدالة الاختبار (Fair Test)."], "workedExamples": [{"concept": "حساب تدريج مخبار مدرج", "explanation": "بين علامتي 40 mL و 50 mL توجد 10 شرطات صغيرة. الفرق = 10 mL ➔ قيمة كل شرطة = 10 ÷ 10 = 1 mL. إذا كان قاع السطح الهلالي عند 3 شرطات فوق الـ 40، تكون القراءة الدقيقة = 43 mL."}], "examTraps": ["فخ النظر من أعلى أو أسفل (Parallax Error): النظر من أعلى يعطي قراءة أعلى من الحقيقة، والنظر من أسفل يعطي قراءة أقل من الحقيقة.", "فخ تكرار القياس: إجراء القياس مرة واحدة لا يضمن الموثوقية؛ يجب تكرار التجربة 3 مرات على الأقل وحساب المتوسط واستبعاد القراءات الشاذة (Anomalous Results)."]}, "flashcards": [{"id": 1, "front": "أين يجب أن تقع عينك أثناء قراءة حجم السائل في المخبار المدرج؟", "back": "على نفس المستوى الأفقي تماماً لأسفل تقعر السائل (قاع الهلال).", "tip": "منع خطأ Parallax Error."}, {"id": 2, "front": "ماذا نطلق على خطأ القياس الناتج عن النظر إلى التدريج بزاوية مائلة؟", "back": "خطأ زاوية الرؤية (Parallax Error).", "tip": "Parallax."}, {"id": 3, "front": "ما وحدة قياس درجة الحرارة المعتمدة في المنهج الدولي؟", "back": "الدرجة السيليزية أو المئوية (°C).", "tip": "درجة سيليزيوس."}, {"id": 4, "front": "ما هي درجة تجمد الماء النقي ودرجة غليانه عند الضغط الجوي العادي؟", "back": "يتجمد عند 0°C ويغلي عند 100°C.", "tip": "نقاط معيارية ثابتة."}, {"id": 5, "front": "ما هو المتغير المستقل (Independent Variable) في التجربة؟", "back": "هو المتغير الذي يقوم الباحث بتغييره عمداً في بداية التجربة لاختبار أثره.", "tip": "الذي أتحكم في تغييره أنا."}, {"id": 6, "front": "ما هو المتغير التابع (Dependent Variable) في التجربة؟", "back": "هو المتغير الذي يتغير تبعاً للتجربة ويقوم الباحث بقياسه وملاحظته.", "tip": "النتيجة المقاسة."}, {"id": 7, "front": "لماذا يجب الحفاظ على ثبات العوامل الأخرى (Controlled Variables)؟", "back": "لضمان أن التغير في النتائج ناتج فقط وحصرياً عن المتغير المستقل ولتكون التجربة عادلة (Fair Test).", "tip": "لضمان عدالة المقارنة."}, {"id": 8, "front": "ماذا نفعل عند وجود نتيجة شاذة أو غير متوقعة (Anomalous Result)؟", "back": "نعيد القياس للتحقق، ونستبعدها عند حساب متوسط النتائج (Mean).", "tip": "استبعاد القيمة الشاذة من المتوسط."}, {"id": 9, "front": "ما هو الجهاز الأنسب لقياس كتلة مادة كيميائية بدقة في المعمل؟", "back": "الميزان الرقمي الحساس (Digital Electronic Balance).", "tip": "يعطي أرقاماً عشرية بالجرام."}, {"id": 10, "front": "كم ثانية توجد في الدقيقة الواحدة وفي الساعة الواحدة؟", "back": "60 ثانية في الدقيقة، و 3,600 ثانية في الساعة الواحدة.", "tip": "60 × 60 = 3600."}]}, {"id": "math106_place_value", "subjectCode": "Math 106", "student": "Mostafa", "unitNumber": 1, "title": "لوحة القيمة المكانية حتى 10,000,000 والصيغة الأسية", "titleEn": "Place Value & Large Numbers up to 10,000,000", "icon": "🔢", "videoId": "", "relatedExamId": "DAILY_Y6_MATH_W1D1", "theory": {"overview": "نظام العد العشري يعتمد على القيمة المكانية (Place Value) حيث تزداد قيمة الرقم بمقدار 10 أضعاف كلما تحركنا خانة واحدة جهة اليسار. يتعامل طلاب الصف السادس مع الأعداد الكبيرة حتى 10 ملايين (7 إلى 8 خانات). تتجمع الأرقام في دورات ثلاثية تفصلها فواصل: دورة الآحاد (آحاد، عشرات، مئات)، دورة الآلاف (آحاد الآلاف، عشرات الآلاف، مئات الآلاف)، ودورة الملايين. عند الضرب في 10 أو 100 أو 1,000، تتحرك الأرقام يساراً بمقدار خانة أو خانتين أو ثلاث خانات وتملأ الخانات الشاغرة بأصفار، بينما في القسمة تتحرك جهة اليمين.", "goldenRules": ["القيمة المكانية (Place Value) هي اسم الخانة (مثل: مئات الآلاف Hundred Thousands).", "قيمة الرقم (Value of the Digit) هي المقدار العددي الفعلي للرقم في تلك الخانة (مثل: 700,000).", "الضرب في 10: تتحرك الأرقام خانة واحدة لليسار ➔ يصبح العدد أكبر بـ 10 مرات.", "الضرب في 100: تتحرك الأرقام خانتين لليسار ➔ نكتبه بصيغة أسية 10².", "القسمة على 10: تتحرك الأرقام خانة واحدة لليمين ➔ يصغر العدد 10 مرات.", "الصيغة الممتدة (Expanded Form): كتابة العدد كمجموع قيم أرقامه (مثل: 3,450,200 = 3,000,000 + 400,000 + 50,000 + 200)."], "workedExamples": [{"concept": "تحديد القيمة وقراءة العدد: 7,425,603", "explanation": "يُقرأ: سبعة ملايين وأربعمائة وخمسة وعشرون ألفاً وستمائة وثلاثة.\nقيمة الرقم 4: يقع في خانة مئات الآلاف ➔ قيمته 400,000.\nإذا قسمنا هذا العدد على 100: تصبح القيمة 74,256.03."}], "examTraps": ["فخ الصفر كحارس خانة (Place Holder): عند كتابة 'خمسة ملايين وسبعة آلاف'، لا تنسَ أصفار عشرات الآلاف ومئات الآلاف: 5,007,000 وليس 5,700.", "فخ تحريك العلامة مقابل تحريك الأرقام: رياضياً الأرقام هي التي تتحرك عبر أعمدة القيمة المكانية وليس الفاصلة العشرية الثابتة."]}, "flashcards": [{"id": 1, "front": "ما هي القيمة المكانية للرقم 5 في العدد 4,582,109؟", "back": "مئات الآلاف (Hundred Thousands).", "tip": "الخانة السادسة من اليمين."}, {"id": 2, "front": "ما هي قيمة الرقم (Value of digit) 8 في العدد 8,340,112؟", "back": "8,000,000 (ثمانية ملايين).", "tip": "ثمانية وأمامها 6 أصفار."}, {"id": 3, "front": "ما ناتج ضرب 42,500 في 100؟", "back": "4,250,000 (أربعة ملايين ومائتان وخمسون ألفاً).", "tip": "حرّك الأرقام خانتين لليسار."}, {"id": 4, "front": "ما ناتج قسمة 3,800,000 على 1,000؟", "back": "3,800 (ثلاثة آلاف وثمانمائة).", "tip": "احذف 3 أصفار أو حركها 3 خانات لليمين."}, {"id": 5, "front": "اكتب العدد بالصيغة القياسية: 6 ملايين + 40 ألفاً + 300 + 5.", "back": "6,040,305", "tip": "احفظ الخانات الشاغرة بأصفار."}, {"id": 6, "front": "كم مائة توجد في العدد 10,000؟", "back": "100 مائة (لأن 100 × 100 = 10,000).", "tip": "10,000 ÷ 100 = 100."}, {"id": 7, "front": "إذا تحرك رقم خانتين إلى اليسار على لوحة القيمة المكانية، فما العملية؟", "back": "ضُرِب الرقم في 100 (أو 10²).", "tip": "يسار يعني ضرب في قوى 10."}, {"id": 8, "front": "قرّب العدد 4,682,510 إلى أقرب مليون.", "back": "5,000,000 (لأن خانة مئات الآلاف 6 وهي أكبر من 5).", "tip": "انظر للرقم الذي على يمين الملايين."}, {"id": 9, "front": "ما هو العدد الذي يقل بمقدار 100,000 عن 2,050,000؟", "back": "1,950,000", "tip": "اطرح 100 ألف من المجموع."}, {"id": 10, "front": "كيف يُكتب المليون بالصيغة الأسية لقوى العشرة؟", "back": "10⁶ (10 مرفوعة للأس 6، أي 1 متبوعاً بـ 6 أصفار).", "tip": "عدد الأصفار = الأس."}]}, {"id": "math106_prime_factors", "subjectCode": "Math 106", "student": "Mostafa", "unitNumber": 2, "title": "شجرة العوامل الأولية والصيغة الأسية (Prime Factor Tree)", "titleEn": "Prime Factorization & Index Notation", "icon": "🌳", "videoId": "XGbOiYhHY2c", "relatedExamId": "DAILY_Y6_MATH_W1D1", "theory": {"overview": "العدد الأولي (Prime Number) هو عدد صحيح أكبر من 1 يمتلك عاملين فقط مختلفين هما: الواحد الصحيح ونفسه فقط (2, 3, 5, 7, 11, 13, 17, 19, 23...). والعدد غير الأولي يسمى عدداً مركباً (Composite Number). تنص المبرهنة الأساسية في الحساب على أن أي عدد مركب يمكن تفكيكه بشكل وحيد إلى حاصل ضرب أعداد أولية. نستخدم 'شجرة العوامل' (Factor Tree) أو القسمة المتكررة لتحليل العدد إلى عوامله الأولية، ثم نكتب الناتج بصورة مختصرة باستخدام الصيغة الأسية (Index Notation).", "goldenRules": ["العدد 2 هو أصغر عدد أولي، وهو العدد الأولي الزوجي الوحيد على الإطلاق.", "العدد 1 ليس أولياً ولا مركباً، لأنه يمتلك عاملاً واحداً فقط (نفسه).", "لتحليل أي عدد: فككه إلى أي عاملين، ثم استمر في تفكيك أي فرع غير أولي حتى تنتهي جميع الفروع بأعداد أولية (أوراق خضراء).", "الصيغة الأسية: التكرار يُكتب كأس؛ مثلاً: 2 × 2 × 2 = 2³ (تقرأ 2 أس 3 أو مكعب 2).", "العامل المشترك الأكبر (HCF) هو حاصل ضرب العوامل الأولية المشتركة بأصغر أس.", "المضاعف المشترك الأصغر (LCM) هو حاصل ضرب جميع العوامل الأولية بأكبر أس."], "workedExamples": [{"concept": "تحليل العدد 72 إلى عوامله الأولية وكتابته بالصيغة الأسية", "explanation": "72 = 8 × 9\n8 = 2 × 4 = 2 × 2 × 2\n9 = 3 × 3\nإذن: 72 = 2 × 2 × 2 × 3 × 3\nبالصيغة الأسية (Index Form): 2³ × 3²"}], "examTraps": ["فخ العدد 9 والعدد 15: ليسا أوليين رغم كونهما فرديين (9 = 3×3، 15 = 3×5). ليس كل فردي أولياً!", "فخ الصفر والواحد: الواحد ليس عدداً أولياً لأن تعريفه يتطلب عاملين مختلفين تماماً."]}, "flashcards": [{"id": 1, "front": "ما هو تعريف العدد الأولي (Prime Number)؟", "back": "عدد كلي أكبر من 1 له عاملان فقط: الواحد ونفسه.", "tip": "عاملان فقط لا يقبل القسمة على غيرهما."}, {"id": 2, "front": "ما هو العدد الأولي الزوجي الوحيد؟ ولماذا؟", "back": "العدد 2، لأن أي عدد زوجي آخر يقبل القسمة على 2 وبالتالي يمتلك أكثر من عاملين.", "tip": "أصغر عدد أولي."}, {"id": 3, "front": "هل العدد 1 عدد أولي؟ وضح السبب.", "back": "لا، لأن له عاملاً واحداً فقط هو 1، بينما العدد الأولي يجب أن يمتلك عاملين مختلفين.", "tip": "يمتلك عاملاً وحيداً فقط."}, {"id": 4, "front": "اكتب جميع الأعداد الأولية الأصغر من 20 بالترتيب.", "back": "2, 3, 5, 7, 11, 13, 17, 19 (مجموعها 8 أعداد).", "tip": "احفظها بالترتيب."}, {"id": 5, "front": "حلل العدد 36 إلى عوامله الأولية بالصيغة الأسية.", "back": "2² × 3² (لأن 2 × 2 × 3 × 3 = 36).", "tip": "4 × 9."}, {"id": 6, "front": "ما ناتج التعبير: 2³ × 5؟", "back": "40 (لأن 2³ = 8، و 8 × 5 = 40).", "tip": "2 × 2 × 2 = 8."}, {"id": 7, "front": "كيف نعرف أن عدداً معيناً غير أولي دون تحليله بالكامل؟", "back": "إذا كان زوجياً أكبر من 2، أو آحاده 5 أو 0، أو مجموع أرقامه يقبل القسمة على 3.", "tip": "استخدم اختبارات قابلية القسمة."}, {"id": 8, "front": "حلل العدد 50 إلى عوامله الأولية.", "back": "2 × 5² (لأن 50 = 2 × 25 = 2 × 5 × 5).", "tip": "2 في مربع خمسة."}, {"id": 9, "front": "ما هو العامل المشترك الأكبر (HCF) للعددين 12 و 18؟", "back": "6 (12 = 2² × 3، و 18 = 2 × 3² ➔ المشترك: 2 × 3 = 6).", "tip": "أكبر قاسم مشترك."}, {"id": 10, "front": "اكتب 120 كحاصل ضرب عوامل أولية بالصيغة الأسية.", "back": "2³ × 3 × 5 (لأن 8 × 3 × 5 = 120).", "tip": "12 × 10."}]}, {"id": "math106_multiplication", "subjectCode": "Math 106", "student": "Mostafa", "unitNumber": 3, "title": "الضرب المطول التفاعلي (Long Multiplication)", "titleEn": "Long Multiplication: Step-by-Step Column & Area Models", "icon": "✖️", "videoId": "", "relatedExamId": "DAILY_Y6_MATH_W1D1", "theory": {"overview": "الضرب المطول (Long Multiplication) هو خوارزمية قياسية لضرب أعداد متعددة الخانات (مثل: 3 أرقام في رقمين: 345 × 26). تعتمد الطريقة الرأسية الرسمية (Column Method) على خاصية التوزيع (Distributive Property)؛ حيث نجزئ عملية الضرب إلى مرحلتين: 1. ضرب العدد العلوي بالكامل في آحاد العدد السفلي. 2. وضع 'صفر القيمة المكانية' (Place Holder Zero) ثم ضرب العدد العلوي في عشرات العدد السفلي. 3. جمع نواتج الضرب الجزئية (Partial Products) بدقة للحصول على الناتج النهائي مع مراعاة الأرقام المرحلة (Carried Digits).", "goldenRules": ["ترتيب الخانات عمودياً بدقة: الآحاد تحت الآحاد، والعشرات تحت العشرات.", "عند الضرب في رقم العشرات، يجب وضع صفر في خانة الآحاد أولاً قبل البدء بالحساب لأننا نضرب في مضاعف للـ 10.", "لا تنسَ جمع الرقم المرحّل (Carry) بعد إتمام الضرب وليس قبله (اضرب أولاً ثم اجمع المرحّل).", "التقدير التقريبي (Estimation) قبل الحل: مثلاً 345 × 26 تقريباً 350 × 25 = 8,750 للتأكد من منطقية الناتج.", "نموذج المساحة (Grid/Area Method) وسيلة ممتازة ومطابقة للتحقق من صحة ناتج الضرب الرأسي."], "workedExamples": [{"concept": "حساب 345 × 26 خطوة بخطوة بالعمود الرأسي", "explanation": "الخطوة 1: ضرب 345 في 6 (الآحاد) ➔ 345 × 6 = 2,070.\nالخطوة 2: وضع 0 في خانة الآحاد، ثم ضرب 345 في 2 (العشرات = 20) ➔ 345 × 20 = 6,900.\nالخطوة 3: جمع الناتجين الجزئيين: 2,070 + 6,900 = 8,970.\nالناتج النهائي = 8,970."}], "examTraps": ["فخ نسيان صفر العشرات: نسيان وضع الصفر في السطر الثاني هو أشهر خطأ يقع فيه الطلاب ويقلل ناتج العشرات بـ 10 أضعاف!", "فخ جمع المرحّل قبل الضرب: إذا ضربت 6 في 4 وكان معك مرحل 3، احسب (6×4)+3 = 27، ولا تجمع 4+3 ثم تضرب في 6!"]}, "flashcards": [{"id": 1, "front": "لماذا نضع صفراً في خانة الآحاد عند الضرب في الرقم الثاني في عملية الضرب المطول؟", "back": "لأن الرقم الثاني يمثل العشرات (Tens)، والضرب في العشرات يعطي ناتجاً من مضاعفات الـ 10.", "tip": "Place-holder zero."}, {"id": 2, "front": "ما ناتج الضرب الذهني السريع: 40 × 60؟", "back": "2,400 (لأن 4 × 6 = 24 ثم نضع الصفرين).", "tip": "اضرب الأرقام وضع الأصفار."}, {"id": 3, "front": "في عملية 248 × 35، ما هي العملية الحسابية في السطر الأول؟", "back": "248 × 5 (ضرب العدد في الآحاد فقط).", "tip": "حاصل الضرب الجزئي الأول."}, {"id": 4, "front": "في نفس العملية 248 × 35، ما هي العملية في السطر الثاني؟", "back": "248 × 30 (أو وضع صفر ثم الضرب في 3).", "tip": "حاصل الضرب الجزئي الثاني."}, {"id": 5, "front": "قدّر ناتج 492 × 19 ذهنياً للتحقق من معقولية الحل.", "back": "تقريباً 500 × 20 = 10,000.", "tip": "التقريب لأقرب مائة وعشرة."}, {"id": 6, "front": "ما ناتج 125 × 8؟", "back": "1,000 تماماً (حقيقة رياضية شائعة وهامة).", "tip": "ثمن الألف."}, {"id": 7, "front": "إذا كان 24 × 15 = 360، فما ناتج 24 × 150؟", "back": "3,600 (لأن أحد العاملين زاد 10 أضعاف فيزيد الناتج 10 أضعاف).", "tip": "أضف صفراً للناتج."}, {"id": 8, "front": "ما ناتج ضرب 314 × 21؟", "back": "6,594 (314 × 1 = 314، و 314 × 20 = 6,280، المجموع = 6,594).", "tip": "314 + 6280."}, {"id": 9, "front": "أي العمليات نقوم بها أولاً عند وجود رقم مرحل: الضرب أم الجمع؟", "back": "الضرب أولاً، ثم نجمع الرقم المرحل على ناتج الضرب.", "tip": "اضرب ثم اجمع المرحل."}, {"id": 10, "front": "ما ناتج 500 × 700؟", "back": "350,000 (5 × 7 = 35 متبوعة بأربعة أصفار).", "tip": "عد الأصفار: 2 + 2 = 4."}]}, {"id": "math106_division", "subjectCode": "Math 106", "student": "Mostafa", "unitNumber": 4, "title": "القسمة المطولة وطريقة الحافلة (Bus Stop Method)", "titleEn": "Long Division: Formal Bus Stop & Interpreting Remainders", "icon": "➗", "videoId": "", "relatedExamId": "DAILY_Y6_MATH_W1D1", "theory": {"overview": "القسمة (Division) هي العملية العكسية للضرب، وتعني توزيع كمية ما بالتساوي أو إيجاد عدد المرات التي يتكرر فيها رقم داخل رقم آخر. في طريقة المظلة أو الحافلة (Bus Stop Method)، نضع المقسوم (Dividend) داخل رمز القسمة، والمقسوم عليه (Divisor) في الخارج جهة اليسار، ونكتب ناتج القسمة (Quotient) في الأعلى. خطوات الخوارزمية الرباعية تتكرر لكل خانة: اقسم (Divide) ➔ اضرب (Multiply) ➔ اطرح (Subtract) ➔ نزّل الرقم التالي (Bring Down). عند وجود باقٍ (Remainder)، يتعلم الطالب التعبير عنه إما كعدد صحيح، أو ككسر اعتيادي (باقي ÷ المقسوم عليه)، أو ككسر عشري بإضافة فاصلة وصفر.", "goldenRules": ["أركان عملية القسمة: المقسوم ÷ المقسوم عليه = ناتج القسمة والباقي.", "خطوات القسمة المطولة الأربعة المكررة: (اقسم، اضرب، اطرح، أنزل الرقم التالي).", "يجب أن يكون الباقي الناتج عن الطرح دائماً أصغر تماماً من المقسوم عليه، وإلا فالمقسوم عليه يتسع لمرة إضافية.", "كتابة الباقي ككسر: إذا قسمنا 17 ÷ 4 = 4 والباقي 1، يُكتب الناتج 4 و ربع (4 ¼).", "التحقق من صحة القسمة: (ناتج القسمة × المقسوم عليه) + الباقي = المقسوم الأصلي."], "workedExamples": [{"concept": "قسمة 768 ÷ 16 باستخدام خوارزمية القسمة المطولة", "explanation": "1. نأخذ أول رقمين: 76 ÷ 16 = 4 (لأن 4 × 16 = 64).\n2. نطرح: 76 - 64 = 12.\n3. نُنزل الرقم التالي (8) فيصبح العدد 128.\n4. نقسم: 128 ÷ 16 = 8 (لأن 8 × 16 = 128 تماماً).\n5. نطرح: 128 - 128 = 0.\nالناتج النهائي = 48 بدون باقٍ."}], "examTraps": ["فخ نسيان الصفر في الناتج: عند إنزال رقم ولم يقبل القسمة (أقل من المقسوم عليه)، يجب وضع صفر في الناتج العلوي أولاً قبل إنزال الرقم الذي يليه!", "فخ تفسير الباقي في المسائل اللفظية: إذا احتجنا حافلات تتسع كل منها لـ 30 طالباً لـ 95 طالباً، 95 ÷ 30 = 3 والباقي 5، الإجابة هي 4 حافلات وليس 3 لأننا لا نترك 5 طلاب دون نقل!"]}, "flashcards": [{"id": 1, "front": "ما هي المسميات الثلاثة لعناصر جملة القسمة: 56 ÷ 8 = 7؟", "back": "56 هو المقسوم (Dividend)، 8 هو المقسوم عليه (Divisor)، 7 هو ناتج القسمة (Quotient).", "tip": "المقسوم، المقسوم عليه، الناتج."}, {"id": 2, "front": "ما هي الخطوات الأربع المتكررة في القسمة المطولة؟", "back": "1. اقسم (Divide)، 2. اضرب (Multiply)، 3. اطرح (Subtract)، 4. أنزل الرقم (Bring Down).", "tip": "DMSB: Dad, Mom, Sister, Brother."}, {"id": 3, "front": "ما ناتج قسمة 450 ÷ 9 ذهنياً؟", "back": "50 (لأن 45 ÷ 9 = 5 ونضع الصفر).", "tip": "حقائق الضرب الأساسية."}, {"id": 4, "front": "إذا كان الباقي بعد عملية الطرح في القسمة المطولة 9 والمقسوم عليه 8، فما المشكلة؟", "back": "الحساب خاطئ؛ يجب أن يكون الباقي دائماً أصغر من المقسوم عليه. كان يجب زيادة ناتج القسمة بـ 1.", "tip": "الباقي أصغر من المقسوم عليه دائماً."}, {"id": 5, "front": "اكتب ناتج 19 ÷ 4 كعدد كسري (مختلط).", "back": "4 ¾ (أربعة وثلاثة أرباع، لأن 19 = 4 × 4 + 3).", "tip": "الباقي يوضع فوق المقسوم عليه."}, {"id": 6, "front": "كيف نتحقق من صحة ناتج القسمة مع وجود باقٍ؟", "back": "نضرب ناتج القسمة في المقسوم عليه ثم نجمع الباقي، ويجب أن يساوي المقسوم الأصلي.", "tip": "(الناتج × القاسم) + الباقي."}, {"id": 7, "front": "مخبز أنتج 125 كعكة ووضع كل 6 كعكات في صندوق، كم صندوقاً ممتلئاً وكم كعكة تتبقى؟", "back": "20 صندوقاً ممتلئاً تماماً (20 × 6 = 120) وتتبقى 5 كعكات دون تعبئة كاملة.", "tip": "125 ÷ 6 = 20 والباقي 5."}, {"id": 8, "front": "ما ناتج 816 ÷ 8؟ (احذر الفخ الشائع!)", "back": "102 وليس 12! (لأن 8 ÷ 8 = 1، ثم 1 ÷ 8 لا يجوز فنضع 0، ثم 16 ÷ 8 = 2).", "tip": "لا تنسَ الصفر الحارس."}, {"id": 9, "front": "ما هو ناتج قسمة أي عدد على نفسه (مثال: 47 ÷ 47)؟", "back": "1 صحيح دائماً.", "tip": "عدد يقسم نفسه."}, {"id": 10, "front": "ما نتيجة قسمة أي عدد على صفر (مثال: 12 ÷ 0)؟", "back": "غير معرفة ومستحيلة رياضياً (Cannot divide by zero).", "tip": "القسمة على صفر محرمة رياضياً."}]}, {"id": "math106_fdp", "subjectCode": "Math 106", "student": "Mostafa", "unitNumber": 5, "title": "محول الكسور والعشري والنسب المئوية (FDP Visual Converter)", "titleEn": "Fractions, Decimals & Percentages Equivalence", "icon": "🔄", "videoId": "", "relatedExamId": "DAILY_Y6_MATH_W1D1", "theory": {"overview": "الكسور الاعتيادية (Fractions)، والكسور العشرية (Decimals)، والنسب المئوية (Percentages) هي ثلاث طرق رياضية مختلفة للتعبير عن نفس القيمة أو الجزء من الكل (FDP Equivalence). النسبة المئوية تعني حرفياً 'من مائة' وترمز لها بالرمز %. للتحويل من كسر إلى نسبة مئوية نوجد كسراً مكافئاً مقامه 100، أو نقسم البسط على المقام ثم نضرب في 100. وللتحويل من نسبة مئوية إلى عشري نقسم على 100 (بتحريك الفاصلة خانتين يساراً). إتقان التحويلات المرجعية الأساسية (مثل النصف، الربع، الأخماس، والأثمان) هو سر السرعة والتفوق في امتحانات كامبريدج.", "goldenRules": ["التحويلات الذهبية المرجعية: ½ = 0.5 = 50% | ¼ = 0.25 = 25% | ¾ = 0.75 = 75%.", "الأخماس (Fifths): ⅕ = 0.2 = 20% | ⅖ = 0.4 = 40% | ⅗ = 0.6 = 60% | ⅘ = 0.8 = 80%.", "الأثمان (Eighths): ⅛ = 0.125 = 12.5% | ⅜ = 0.375 = 37.5% | ⅝ = 0.625 = 62.5% | ⅞ = 0.875 = 87.5%.", "الأعشار والأجزاء من مائة: 1/10 = 0.1 = 10% | 1/100 = 0.01 = 1%.", "لحساب نسبة مئوية من كمية: احسب 10% أولاً (بالقسمة على 10) ثم ضاعفها أو اقسم على 2 لحساب 5%."], "workedExamples": [{"concept": "مقارنة وترتيب قيم مختلطة: 0.65 ، 60% ، ⅔ ، ⅝", "explanation": "نوحد جميع القيم إلى نسب مئوية أو أعداد عشرية للمقارنة العادلة:\n0.65 = 65%\n60% = 60%\n⅔ = 0.666... ≈ 66.7%\n⅝ = 0.625 = 62.5%\nالترتيب التصاعدي من الأصغر للأكبر: 60% < ⅝ (62.5%) < 0.65 (65%) < ⅔ (66.7%)."}], "examTraps": ["فخ الصفر العشري: 0.5 تعني 50% وليست 5%! أما 5% فتكتب 0.05. انتبه لموضع الفاصلة العشرية.", "فخ الثلث: ⅓ لا يساوي 30% أبداً، بل يساوي 33.33% (كسر عشري دوري)."]}, "flashcards": [{"id": 1, "front": "ما هي النسبة المئوية والقيمة العشرية المكافئة للكسر ½؟", "back": "0.5 و 50%", "tip": "نصف المائة."}, {"id": 2, "front": "ما هو الكسر العشري المكافئ لـ 25% والكسر الاعتيادي المبسط؟", "back": "0.25 والكسر هو ¼", "tip": "ربع المائة."}, {"id": 3, "front": "حوّل الكسر ⅘ إلى نسبة مئوية.", "back": "80% (لأن ⅕ = 20%، فنضرب 20% × 4 = 80%).", "tip": "أربعة أخماس."}, {"id": 4, "front": "ما هو الكسر الاعتيادي في أبسط صورة لـ 75%؟", "back": "¾ (ثلاثة أرباع).", "tip": "75/100 بقسمة البسط والمقام على 25."}, {"id": 5, "front": "ما القيمة العشرية لـ ⅛ (ثمن)؟", "back": "0.125 (وهي تعادل 12.5%).", "tip": "نصف الربع (نصف 0.25)."}, {"id": 6, "front": "كيف تحسب ذهنياً 10% من أي مبلغ (مثلاً 10% من 340 جنيه)؟", "back": "نقسم المبلغ على 10 (340 ÷ 10 = 34 جنيه).", "tip": "حذف الصفر أو تحريك الفاصلة."}, {"id": 7, "front": "احسب 15% من 80 ذهنياً بخطوات سريعة.", "back": "12 (10% من 80 = 8، و 5% = نصف الثمانية = 4 ➔ 8 + 4 = 12).", "tip": "10% + 5%."}, {"id": 8, "front": "حوّل 0.08 إلى نسبة مئوية.", "back": "8% (نضرب في 100 بتحريك الفاصلة خانتين يميناً).", "tip": "ثمانية من مائة."}, {"id": 9, "front": "أيهما أكبر: 0.7 أم 68%؟", "back": "0.7 هي الأكبر لأن 0.7 = 70% بينما الأخرى 68%.", "tip": "0.7 = 0.70 = 70%."}, {"id": 10, "front": "ما هو الكسر الاعتيادي المكافئ للنسبة المئوية 33⅓%؟", "back": "⅓ (ثلث بالضبط).", "tip": "100 ÷ 3 = 33.333..."}]}, {"id": "math106_bodmas", "subjectCode": "Math 106", "student": "Mostafa", "unitNumber": 6, "title": "ترتيب العمليات والأعداد السالبة (BODMAS & Negative Numbers)", "titleEn": "Order of Operations (BODMAS) & Directed Numbers", "icon": "⚖️", "videoId": "", "relatedExamId": "DAILY_Y6_MATH_W1D1", "theory": {"overview": "ترتيب العمليات الحسابية (Order of Operations) محكوم بقاعدة دولية تسمى BODMAS لضمان الحصول على إجابة صحيحة واحدة لأي تعبير رياضي مركب: 1. الأقواس (Brackets) أولاً. 2. الأسس والجذور (Orders/Powers). 3. القسمة والضرب (Division & Multiplication) من اليسار إلى اليمين حسب الأسبقية. 4. الجمع والطرح (Addition & Subtraction) من اليسار إلى اليمين. وبالنسبة للأعداد السالبة (Negative Numbers): فهي الأعداد التي تقع على يسار الصفر على خط الأعداد. عند طرح عدد سالب، يتحول إلى جمع لأن 'طرح السالب إضافة': 5 - (-3) = 5 + 3 = 8.", "goldenRules": ["أولوية BODMAS الصارمة: B (الأقواس) ➔ O (الأسس) ➔ DM (الضرب والقسمة معاً) ➔ AS (الجمع والطرح معاً).", "إذا تساوت الرتبة (مثل ضرب وقسمة متتاليين)، نحل بالترتيب من اليسار إلى اليمين.", "قاعدة الإشارات في خط الأعداد: التحرك لليمين يمثل زيادة (+) والتحرك لليسار يمثل نقصاناً (-).", "طرح عدد سالب يعادل إضافة عدد موجب: a - (-b) = a + b.", "جمع عددين مختلفي الإشارة: نأخذ الفرق بينهما ونضع إشارة العدد الأكبر في القيمة المطلقة: -8 + 3 = -5.", "الصفر ليس موجباً ولا سالباً، وهو نقطة الأصل الفاصلة على خط الأعداد."], "workedExamples": [{"concept": "حل تعبير مركب: 4 + 6 × (8 - 3) - 10 ÷ 2", "explanation": "الخطوة 1 (الأقواس أولاً): (8 - 3) = 5 ➔ التعبير: 4 + 6 × 5 - 10 ÷ 2\nالخطوة 2 (الضرب والقسمة من اليسار): 6 × 5 = 30 ، 10 ÷ 2 = 5 ➔ التعبير: 4 + 30 - 5\nالخطوة 3 (الجمع والطرح من اليسار): 4 + 30 = 34 ➔ 34 - 5 = 29.\nالناتج النهائي = 29."}, {"concept": "مسألة درجات الحرارة السالبة", "explanation": "كانت درجة الحرارة في موسكو -4°C، وانخفضت بمقدار 7 درجات إضافية ليلاً. ما درجة الحرارة الجديدة؟\nالحساب: -4 - 7 = -11°C (تحركنا 7 وحدات إضافية جهة اليسار)."}], "examTraps": ["فخ الحساب المتتالي الساذج: 2 + 3 × 4 لا تساوي 20 أبداً! لأن الضرب يسبق الجمع: 3 × 4 = 12 ثم 12 + 2 = 14.", "فخ السالب المزدوج: -5 - (-8) تعني -5 + 8 = +3 وليس -13."]}, "flashcards": [{"id": 1, "front": "ماذا تعني الحروف الستة في قاعدة BODMAS؟", "back": "Brackets (أقواس), Orders (أسس), Division (قسمة), Multiplication (ضرب), Addition (جمع), Subtraction (طرح).", "tip": "احفظ الكلمة الإنجليزية."}, {"id": 2, "front": "احسب ناتج: 3 + 4 × 2 بدون أخطاء.", "back": "11 (نضرب أولاً: 4 × 2 = 8، ثم نجمع: 3 + 8 = 11).", "tip": "الضرب يسبق الجمع دائماً."}, {"id": 3, "front": "احسب ناتج: (10 - 2) × 3", "back": "24 (نحل ما بداخل الأقواس أولاً: 10 - 2 = 8، ثم 8 × 3 = 24).", "tip": "الأقواس لها الأولوية القصوى."}, {"id": 4, "front": "ما ناتج: 5 - (-4)؟", "back": "9 (لأن طرح عدد سالب يتحول إلى جمع: 5 + 4 = 9).", "tip": "طرح السالب يعطي موجب."}, {"id": 5, "front": "احسب ناتج: -7 + 10", "back": "3 (الفرق بين 10 و 7 هو 3 وإشارة الأكبر موجبة).", "tip": "ابدأ عند -7 وتحرك 10 خطوات يميناً."}, {"id": 6, "front": "ما ناتج: 20 ÷ 4 × 2؟ (فخ الترتيب المتساوي!)", "back": "10 (لأن القسمة والضرب متساويان في الرتبة، فنبدأ من اليسار لليمين: 20 ÷ 4 = 5 ثم 5 × 2 = 10).", "tip": "من اليسار إلى اليمين."}, {"id": 7, "front": "إذا كانت درجة الحرارة -2°C وارتفعت بمقدار 5 درجات، فكم تصبح؟", "back": "3°C (لأن -2 + 5 = 3).", "tip": "ارتفاع يعني جمع."}, {"id": 8, "front": "ما ناتج: 2³ + 5؟", "back": "13 (نحسب الأس أولاً: 2³ = 8، ثم 8 + 5 = 13).", "tip": "الأسس تسبق الجمع."}, {"id": 9, "front": "أي العمليتين تُنفذ أولاً: الطرح أم الأقواس؟", "back": "الأقواس دائماً هي صاحبة الأولوية المطلقة الأولى في الرياضيات.", "tip": "الرمز B يأتي أولاً."}, {"id": 10, "front": "احسب ناتج: -6 - 4", "back": "-10 (نبدأ من -6 ونتحرك 4 وحدات يساراً في اتجاه السالب).", "tip": "خسارة 6 وخسارة 4 تعني خسارة 10."}]}, {"id": "sci105_plant_anatomy", "subjectCode": "Science 105", "student": "Ali", "unitNumber": 1, "title": "تشريح النبات وأوعية الخشب واللحاء (Plant Anatomy)", "titleEn": "Plant Anatomy: Roots, Stems, Leaves, Xylem & Phloem", "icon": "🌱", "videoId": "yuMiXt2I_xI", "relatedExamId": "DAILY_Y5_SCI_W1D1", "theory": {"overview": "يتكون النبات الزهري من أعضاء رئيسية متخصصة: 1. الجذور (Roots): تثبت النبات في التربة وتمتص الماء والأملاح المعدنية عبر شعيرات جذرية دقيقة مجهرية تزيد مساحة السطح الماص. 2. الساق (Stem): يدعم الأوراق والأزهار ويحتوي على الحزم الوعائية (Vascular Bundles) لنقل السوائل. 3. الأوراق (Leaves): مصنع الغذاء حيث تحدث عملية البناء الضوئي (Photosynthesis). تمتلك النباتات نظام نقل وعائي يتكون من أنبوبين متميزين: أوعية الخشب (Xylem) التي تنقل الماء والأملاح من الجذور صعوداً فقط إلى الأوراق، وأنابيب اللحاء (Phloem) التي تنقل السكريات المصنوعة في الأوراق إلى جميع أجزاء النبات صعوداً وهبوطاً.", "goldenRules": ["أوعية الخشب (Xylem): تنقل الماء والأملاح المعدنية في اتجاه واحد فقط صعوداً من الجذر إلى الساق والأوراق.", "أنابيب اللحاء (Phloem): تنقل الغذاء وسكر الجلوكوز في اتجاهين (صعوداً وهبوطاً) من الأوراق إلى البراعم والجذور للتخزين والنمو.", "الشعيرات الجذرية (Root Hair Cells): خلايا رقيقة طويلة تزيد مساحة السطح لامتصاص أقصى كمية من الماء بالأسموزية.", "الثغور (Stomata): فتحات مجهرية على السطح السفلي للورقة تسمح بتبادل الغازات (دخول CO2 وخروج O2) وخروج بخار الماء في عملية النتح (Transpiration).", "عملية النتح (Transpiration Pull): تبخر الماء من الأوراق يخلق قوة سحب تشبه الشفاطة تسحب الماء عبر الخشب لأعلى."], "workedExamples": [{"concept": "تجربة ساق الكرفس المغمور في ماء ملون", "explanation": "عند وضع ساق نبات كرفس أبيض في كأس به ماء مصبوغ بلون أحمر لعدة ساعات، نلاحظ تلون عروق الأوراق باللون الأحمر.\nالاستنتاج: صعد الماء الملون عبر أوعية الخشب الدقيقة داخل الساق حتى وصل إلى الأوراق ليثبت مسار انتقال الماء الصاعد."}], "examTraps": ["فخ اتجاه النقل: الخشب اتجاه واحد فقط (لأعلى)، بينما اللحاء ثنائي الاتجاه (لأعلى ولأسفل لتغذية الجذور النامية والثمار).", "فخ امتصاص الغذاء: النبات لا يمتص الغذاء الجاهز من التربة، بل يصنع غذاءه بنفسه في الأوراق بعملية البناء الضوئي باستخدام الضوء والماء وثاني أكسيد الكربون."]}, "flashcards": [{"id": 1, "front": "ما هي الوظيفة الأساسية لأوعية الخشب (Xylem) في النبات؟", "back": "نقل الماء والأملاح المعدنية المذابة من الجذور صعوداً إلى الساق والأوراق.", "tip": "اتجاه واحد فقط لأعلى."}, {"id": 2, "front": "ما هي الوظيفة الأساسية لأنابيب اللحاء (Phloem)؟", "back": "نقل سكر الجلوكوز والمواد الغذائية المصنوعة في الأوراق إلى كافة أجزاء النبات.", "tip": "نقل الغذاء في اتجاهين."}, {"id": 3, "front": "ما وظيفة الشعيرات الجذرية (Root Hairs)؟", "back": "زيادة مساحة سطح الجذر لامتصاص كميات أكبر من الماء والأملاح من التربة بكفاءة.", "tip": "امتدادات دقيقة تشبه الشعر."}, {"id": 4, "front": "في أي جزء من أجزاء النبات تحدث معظم عمليات البناء الضوئي؟", "back": "في الأوراق الخضراء (Leaves) لاحتوائها على البلاستيدات الخضراء ومادة الكلوروفيل.", "tip": "مصنع غذاء النبات."}, {"id": 5, "front": "ماذا نطلق على الفتحات المجهرية الصغيرة على سطح ورقة النبات؟", "back": "الثغور (Stomata).", "tip": "مسام تبادل الغازات."}, {"id": 6, "front": "ما هي عملية النتح (Transpiration) في النبات؟", "back": "تبخر الماء على هيئة بخار ماء من ثغور الأوراق إلى الغلاف الجوي.", "tip": "فقدان الماء بالتبخر."}, {"id": 7, "front": "ما الغاز الذي يمتصه النبات نهاراً للبناء الضوئي وما الغاز الذي يطلقه؟", "back": "يمتص غاز ثاني أكسيد الكربون (CO2) ويطلق غاز الأكسجين (O2).", "tip": "عكس تنفس الإنسان."}, {"id": 8, "front": "ما هما المادتان الأساسيتان اللتان يحتاجهما النبات لصنع سكر الجلوكوز؟", "back": "الماء وثاني أكسيد الكربون في وجود ضوء الشمس والكلوروفيل.", "tip": "ماء + غاز + ضوء."}, {"id": 9, "front": "لماذا تموت النبتة إذا تلفت أوعية الخشب فيها تماماً؟", "back": "لأن الماء والأملاح لن تصعد للأوراق، فتذبل النبتة ويتوقف البناء الضوئي وتجف.", "tip": "انقطاع إمداد الماء."}, {"id": 10, "front": "ما الجزء في النبات الذي يوفر الدعم الهيكلي ويرفع الأوراق نحو الشمس؟", "back": "الساق (Stem).", "tip": "الجذع أو الساق القائمة."}]}, {"id": "sci105_pollination", "subjectCode": "Science 105", "student": "Ali", "unitNumber": 2, "title": "تلقيح الأزهار وانتشار البذور (Pollination & Seed Dispersal)", "titleEn": "Flower Anatomy, Pollination & Seed Dispersal Mastery", "icon": "🌸", "videoId": "p3St51F4kE8", "relatedExamId": "DAILY_Y5_SCI_W1D1", "theory": {"overview": "الزهرة هي عضو التكاثر الجنسي في النباتات مغطاة البذور. تتكون الزهرة النموذجية من: 1. السبلات (Sepals): أوراق خضراء تحمي البرعم قبل تفتحه. 2. البتلات (Petals): أوراق ملونة زاهية لجذب الحشرات والطيور. 3. عضو التذكير ويسمى الطلع/السداة (Stamen): ويتكون من المتك (Anther) الذي ينتج حبوب اللقاح، والخيط (Filament). 4. عضو التأنيث ويسمى المتاع/الكربلة (Carpel/Pistil): ويتكون من الميسم اللزج (Stigma)، القلم (Style)، والمبيض (Ovary) الذي يحتوي على البويضات (Ovules). التلقيح (Pollination) هو انتقال حبوب اللقاح من المتك إلى الميسم. وبعد الإخصاب، تتحول البويضة إلى بذرة ويتحول المبيض إلى ثمرة. وتنتشر البذور بعيداً عن النبات الأم عبر 4 آليات: الرياح، الحيوانات، الماء، أو الانفجار الذاتي.", "goldenRules": ["التلقيح (Pollination): نقل حبوب اللقاح من المتك (Anther) إلى الميسم (Stigma).", "الأزهار الملقحة بالحشرات: بتلاتها كبيرة وملونة وبها رائحة ورحيق، وحبوب لقاحها لزجة وخشنة.", "الأزهار الملقحة بالرياح: بتلاتها صغيرة وخضراء وبدون رائحة، ومتكها متدلية في الهواء، وحبوب لقاحها خفيفة وجافة جداً، وميسمها ريشي.", "الإخصاب (Fertilization): اندماج نواة حبة اللقاح مع نواة البويضة داخل المبيض لتكوين الجنين النباتي.", "طرق انتشار البذور الأربعة: الرياح (بذور ذات مظلات كالهندباء)، الحيوانات (ثمار حلوة تؤكل أو أشواك تعلق بالفرو)، الماء (بذور جوز الهند تطفو)، والانفجار الميكانيكي (قرون البازلاء تفرقع وتطلق البذور)."], "workedExamples": [{"concept": "مقارنة تكيف بذور الهندباء وبذور الداتورة الشوكية", "explanation": "بذور الهندباء (Dandelion): تمتلك شعيرات ريشية تشبه المظلة (Parachute) تلتقط نسيم الهواء لتطير لمسافات طويلة عبر الرياح.\nبذور الداتورة أو العليق: تمتلك خطاطيف وأشواك دقيقة (Hooks) تتعلق بفرو الحيوانات وملابس المارة لتنقلها بعيداً عن النبات الأم لمنع التنافس على الضوء والماء."}], "examTraps": ["فخ الخلط بين التلقيح والإخصاب: التلقيح هو مجرد وصول حبوب اللقاح إلى الميسم؛ أما الإخصاب فهو الاندماج الفعلي داخل المبيض لتكوين البذرة.", "فخ انتشار البذور مقابل التلقيح: التلقيح ينقل حبوب اللقاح (مجهرية)، بينما انتشار البذور ينقل البذرة الكاملة بعد نضج الثمرة."]}, "flashcards": [{"id": 1, "front": "ما هو العضو الذكري في الزهرة وما الأجزاء التي يتكون منها؟", "back": "السداة (Stamen) وتتكون من المتك (Anther) والخيط (Filament).", "tip": "Stamen تنتهي بـ men."}, {"id": 2, "front": "ما هو العضو الأنثوي في الزهرة وما هي أجزاؤه الثلاثة؟", "back": "الكربلة (Carpel) وتتكون من الميسم اللزج (Stigma)، القلم (Style)، والمبيض (Ovary).", "tip": "الميسم، القلم، المبيض."}, {"id": 3, "front": "ما هي وظيفة الميسم (Stigma) في الزهرة؟", "back": "استقبال حبوب اللقاح والتقاطها بسطحه اللزج لمنع تطايرها.", "tip": "سطح لزج يمسك الحبوب."}, {"id": 4, "front": "ما الفرق بين التلقيح بالحشرات والتلقيح بالرياح من حيث شكل البتلات؟", "back": "تلقيح الحشرات: بتلات ملونة زاهية وكبيرة ورائحة عطرية. تلقيح الرياح: بتلات صغيرة وخضراء وغير ملفتة.", "tip": "جذب الحشرات يحتاج ألواناً."}, {"id": 5, "front": "إلى ماذا يتحول مبيض الزهرة بعد إتمام عملية الإخصاب بنجاح؟", "back": "يتحول المبيض إلى ثمرة (Fruit)، وتتحول البويضات بداخله إلى بذور (Seeds).", "tip": "المبيض ثمرة والبويضة بذرة."}, {"id": 6, "front": "لماذا يجب أن تنتشر البذور بعيداً عن النبات الأم (Seed Dispersal)؟", "back": "لتجنب التنافس (Competition) على ضوء الشمس، الماء، الأملاح المعدنية، ومساحة النمو.", "tip": "منع التزاحم والتنافس."}, {"id": 7, "front": "كيف تنتشر بذور نبات الهندباء (Dandelion)؟", "back": "بواسطة الرياح بفضل مظلتها الريشية الخفيفة التي تطير في الهواء.", "tip": "مظلات هوائية صغيرة."}, {"id": 8, "front": "كيف تساعد الحيوانات في انتشار بذور الثمار العصيرية مثل التفاح والطماطم؟", "back": "تأكل الحيوانات الثمار، وتمر البذور الصلبة عبر جهازها الهضمي دون هضم وتخرج مع الفضلات بعيداً.", "tip": "أكل الثمار وإخراج البذور."}, {"id": 9, "front": "ما الطريقة التي ينشر بها نبات البازلاء (Peas) بذوره؟", "back": "طريقة الانفجار الميكانيكي (Explosive/Self-dispersal)؛ يجف القرن وينفتح فجأة بقوة قاذفاً البذور.", "tip": "فرقعة القرن الجاف."}, {"id": 10, "front": "ما هي الشروط الثلاثة الأساسية لإنبات أي بذرة (Germination)؟", "back": "الماء (Water)، الأكسجين (Oxygen)، والدفء/الحرارة المناسبة (Warmth) - اختصار WOW.", "tip": "قاعدة WOW."}]}, {"id": "sci105_sound_vibrations", "subjectCode": "Science 105", "student": "Ali", "unitNumber": 3, "title": "اهتزازات الصوت والموجات وانتقالها في المواد", "titleEn": "Sound: Vibrations, Waves & Traveling Through Mediums", "icon": "🔊", "videoId": "3-xKZKxXuu0", "relatedExamId": "DAILY_Y5_SCI_W1D1", "theory": {"overview": "ينشأ الصوت دائماً وبشكل حصري عن اهتزاز الأجسام (Vibrations). عندما يهتز جسم ما (مثل وتر جيتار أو شوكة رنانة أو الحبال الصوتية في الحنجرة)، فإنه يدفع جزيئات الهواء المحيطة به ذهاباً وإياباً لتصطدم بالجزيئات المجاورة، مكوناً موجات تضاغط (Compressions) وتخلخل (Rarefactions) تنتقل عبر الوسط المادي حتى تصل إلى طبلة الأذن فتهتز ونسمع الصوت. يحتاج الصوت بالضرورة إلى وسط مادي (صلب أو سائل أو غاز) لكي ينتقل عبره، ولذلك لا يستطيع الصوت الانتقال في الفراغ (Vacuum) لعدم وجود جزيئات تتصادم. ينتقل الصوت أسرع ما يمكن في المواد الصلبة لأن جزيئاتها متقاربة جداً ومرتبطة بقوة، ثم في السوائل، وأبطأ ما يمكن في الغازات كالهواء.", "goldenRules": ["الصوت ينشأ عن الاهتزاز (Vibrations): لا اهتزاز = لا صوت إطلاقاً.", "الصوت موجة ميكانيكية تحتاج إلى وسط مادي (Medium) ولا تنتقل في الفراغ (Space Vacuum).", "سرعة الصوت: في المواد الصلبة (أسرع شيء ~ 5000 م/ث في الحديد) > في السوائل (~ 1500 م/ث في الماء) > في الغازات (أبطأ شيء ~ 340 م/ث في الهواء).", "آلية السمع: موجات الصوت تدخل القناة السمعية ➔ تهتز طبلة الأذن ➔ تهتز العظيمات الثلاث ➔ القوقعة ترسل إشارات عصبية للمخ.", "المواد اللينة والمسامية (كاللباد والإسفنج والصوف) تمتص الصوت وتقلل الضوضاء (Soundproofing)."], "workedExamples": [{"concept": "تجربة الناقوس الزجاجي وتفريغ الهواء (Bell Jar Experiment)", "explanation": "نضع جرساً كهربائياً يرن داخل ناقوس زجاجي شفاف. عندما يعمل الجرس نراه يهتز ونسمع صوته بوضوح. عند تشغيل مضخة تفريغ الهواء وسحب الهواء تدريجياً، نلاحظ استمرار حركة مطرقة الجرس لكن صوته يضعف حتى يختفي تماماً!\nالاستنتاج: الصوت لا يمكنه السفر في الفراغ لغياب الجزيئات الناقلة للاهتزاز."}], "examTraps": ["فخ الصوت في الفضاء الخارجي: مشاهد أفلام الخيال العلمي التي تُسمع فيها انفجارات ضخمة في الفضاء خاطئة علمياً؛ الفضاء فراغ تام خالي من الهواء فلا صوت فيه أبداً!", "فخ الصواعق والبرق: نرى البرق أولاً ثم نسمع الرعد بعد ثوانٍ لأن الضوء أسرع ملايين المرات من الصوت (سرعة الضوء 300,000 كم/ث بينما الصوت 0.34 كم/ث)."]}, "flashcards": [{"id": 1, "front": "ما هو السبب الحقيقي والوحيد لإنتاج أي صوت في الطبيعة؟", "back": "اهتزاز الأجسام ذهاباً وإياباً (Vibrations).", "tip": "حركة اهتزازية سريعة."}, {"id": 2, "front": "لماذا لا يستطيع رواد الفضاء التحدث مباشرة وسماع بعضهم على سطح القمر دون أجهزة لاسلكي؟", "back": "لأن القمر لا يمتلك غلافاً جوياً؛ والفراغ لا يحتوي على جزيئات تهتز وتنقل الصوت.", "tip": "الفراغ لا ينقل الصوت."}, {"id": 3, "front": "في أي حالات المادة الثلاث ينتقل الصوت بأسرع ما يمكن؟ ولماذا؟", "back": "في المواد الصلبة (Solids)، لأن جزيئاتها متقاربة جداً وتصطدم ببعضها بسرعة فائقة.", "tip": "الصلب أسرع من السائل والغاز."}, {"id": 4, "front": "ما هي سرعة الصوت التقريبية في الهواء؟", "back": "حوالي 340 متراً في الثانية (340 m/s).", "tip": "ثلث كيلومتر في الثانية."}, {"id": 5, "front": "لماذا نرى وميض البرق قبل سماع دوي الرعد في العواصف الرعدية؟", "back": "لأن سرعة الضوء هائلة جداً مقارنة بسرعة الصوت البطيئة نسبياً في الهواء.", "tip": "الضوء أسرع من الصوت."}, {"id": 6, "front": "ما الجزء في أذن الإنسان الذي يهتز أولاً عند استقبال الموجات الصوتية؟", "back": "طبلة الأذن (Eardrum).", "tip": "غشاء رقيق مشدود كالدَف."}, {"id": 7, "front": "ماذا نطلق على ارتداد موجات الصوت عند اصطدامها بسطح صلب مستوٍ؟", "back": "الصدى (Echo).", "tip": "انعكاس الصوت."}, {"id": 8, "front": "ما نوع المواد الأفضل في امتصاص الصوت وعزله لمنع الضوضاء؟", "back": "المواد اللينة والمسامية غير المنتظمة مثل الإسفنج، الصوف، والسجاد السميك.", "tip": "تحبس الهواء بين مسامها."}, {"id": 9, "front": "كيف يصدر الإنسان صوته أثناء الكلام؟", "back": "باهتزاز الحبال الصوتية (Vocal Cords) في الحنجرة بفعل هواء الزفير المندفع من الرئتين.", "tip": "أوتار الحنجرة."}, {"id": 10, "front": "هل ينتقل الصوت تحت الماء في حمام السباحة؟ وضح.", "back": "نعم، وينتقل في الماء أسرع بنحو 4 مرات من الهواء لأن جزيئات الماء أكثر تقارباً.", "tip": "تسمع دقات الحصى تحت الماء بوضوح."}]}, {"id": "sci105_pitch_loudness", "subjectCode": "Science 105", "student": "Ali", "unitNumber": 4, "title": "مختبر حدة الصوت وشدته والراسم التذبذبي", "titleEn": "Pitch vs Loudness Laboratory & Oscilloscope Waves", "icon": "🎛️", "videoId": "3-xKZKxXuu0", "relatedExamId": "DAILY_Y5_SCI_W1D1", "theory": {"overview": "يميز الإنسان بين الأصوات من خلال خاصيتين فيزيائيتين مستقلتين تماماً: 1. شدة الصوت (Loudness): تصف مدى علو الصوت أو هدوءه، وتعتمد على سعة الاهتزازة (Amplitude - كمية الطاقة). الاهتزازات الكبيرة تنتج صوتاً عالياً وموجات ذات قمم مرتفعة وقيعان عميقة، وتقاس الشدة بالديسيبل (Decibels - dB). 2. حدة الصوت (Pitch): تصف مدى كون الصوت رفيعاً/حاداً (مثل صفارة الحكم أو صوت العصفور) أو غليظاً/عميقاً (مثل هدير الأسد أو طبلة الباص). تعتمد الحدة على تردد الاهتزاز (Frequency - عدد الاهتزازات في الثانية الواحدة ويقاس بالهرتز Hz). الاهتزاز السريع يعطي صوتاً عالي الحدة (High Pitch)، والاهتزاز البطيء يعطي صوتاً منخفض الحدة (Low Pitch).", "goldenRules": ["شدة الصوت (Loudness) تعتمد على سعة الموجة (Amplitude): ضرب الطبل بقوة = سعة أكبر = صوت أعلى (Loud).", "حدة الصوت (Pitch) تعتمد على التردد (Frequency): اهتزاز أسرع = تردد أعلى = صوت أرفع وأكثر حدة (High Pitch).", "في الآلات الوترية: الأوتار الأقصر والأرفع والأكثر شدّاً تهتز أسرع وتنتج نغمة أعلى حدة (Higher Pitch).", "في آلات النفخ وأعمدة الهواء: عمود الهواء الأقصر يهتز أسرع وينتج صوتاً أعلى حدة.", "الأصوات التي تزيد شدتها عن 85 ديسيبل (dB) لفترات ممتدة تسبب تلفاً دائماً لخلايا السمع الحساسة في الأذن."], "workedExamples": [{"concept": "تفسير شكل موجات الصوت على جهاز الراسم التذبذبي (Oscilloscope)", "explanation": "صوت عالي وهادئ (Soft vs Loud): الصوت العالي يمتلك موجة طويلة السعة (قمة مرتفعة)، والصوت الهادئ يمتلك موجة قصيرة السعة.\nصوت حاد وغليظ (Low vs High Pitch): الصوت الحاد يمتلك موجات متقاربة جداً ومزدحمة (تردد عالٍ)، بينما الصوت الغليظ موجاته متباعدة ومتسعة (تردد منخفض)."}], "examTraps": ["فخ الخلط بين الحدة والشدة: الصوت يمكن أن يكون عالي الشدة ومنخفض الحدة معاً (مثل زئير الأسد العالي القوي)، أو هادئ الشدة وعالي الحدة (مثل همس صفارة البعوضة).", "فخ الأوتار: شد الوتر يغير حدته (Pitch) وليس شدته؛ الشدة تتغير فقط بقوة النقر على الوتر."]}, "flashcards": [{"id": 1, "front": "ما هي الخاصية المسؤولة عن جعل الصوت حاداً (رفيعاً) أو غليظاً؟", "back": "حدة الصوت (Pitch) وتعتمد على تردد الاهتزاز (Frequency).", "tip": "Pitch."}, {"id": 2, "front": "ما هي الخاصية المسؤولة عن جعل الصوت مرتفعاً وقوياً أو خافضاً وهادئاً؟", "back": "شدة الصوت (Loudness) وتعتمد على سعة الاهتزاز (Amplitude).", "tip": "Loudness."}, {"id": 3, "front": "كيف تجعل صوت وتر الجيتار أكثر حدة (Higher Pitch)؟", "back": "بتقصير طول الوتر، أو شدّه بقوة أكبر، أو استخدام وتر أرفع.", "tip": "أقصر، أشد، أرفع."}, {"id": 4, "front": "ماذا يحدث لشكل الموجة على شاشة راسم الذبذبات إذا زادت شدة الصوت؟", "back": "يزداد ارتفاع الموجة (السعة Amplitude تصبح أطول لأعلى ولأسفل).", "tip": "قمم أعلى وقيعان أعمق."}, {"id": 5, "front": "ماذا يحدث للموجة على شاشة راسم الذبذبات إذا زادت حدة الصوت (التردد)؟", "back": "تتقارب الموجات من بعضها وتتكرر مرات أكثر في نفس الثانية (تردد أعلى).", "tip": "موجات مضغوطة متقاربة."}, {"id": 6, "front": "ما وحدة قياس شدة ومستوى ضجيج الصوت في المعمل؟", "back": "الديسيبل (Decibel) ورمزها dB.", "tip": "Decibels."}, {"id": 7, "front": "ماذا نطلق على عدد الاهتزازات الكاملة التي يحدثها الجسم في الثانية الواحدة؟", "back": "التردد (Frequency) ويقاس بالهرتز (Hz).", "tip": "كم اهتزازة بالثانية."}, {"id": 8, "front": "إذا ضربت طبلة بقوة أكبر، فهل يتغير ترددها أم سعتها؟", "back": "تزداد سعتها (فتصبح أعلى صوتاً)، بينما يبقى التردد والحدة ثابتين لطالما لم يتغير حجم الطبلة.", "tip": "قوة الضربة تغير السعة فقط."}, {"id": 9, "front": "عند النفخ في زجاجة ماء، متى يكون الصوت أعلى حدة: عندما تكون مملوءة تقريباً أم فارغة؟", "back": "عندما تكون ممتلئة تقريباً، لأن عمود الهواء بداخلها قصير فيهتز بسرعة أكبر.", "tip": "عمود هواء أقصر = تردد أسرع."}, {"id": 10, "front": "ما الخطر المحتمل لسماع الموسيقى بسماعات الأذن بصوت مرتفع جداً لفترات طويلة؟", "back": "تلف خلايا الشعر الحساسة داخل قوقعة الأذن مما يؤدي لفقدان السمع الدائم.", "tip": "الحفاظ على حاسة السمع."}]}, {"id": "math105_divisibility", "subjectCode": "Math 105", "student": "Ali", "unitNumber": 1, "title": "فاحص ومعمل قابلية القسمة الذكي (Tests of Divisibility)", "titleEn": "Tests of Divisibility: Mental Math for 2, 3, 4, 5, 6, 8, 9, 10, 25, 100", "icon": "⚡", "videoId": "Luq06b4D6bE", "relatedExamId": "DAILY_Y5_MATH_W1D1", "theory": {"overview": "قواعد قابلية القسمة (Tests of Divisibility) هي مهارات حساب ذهني فائقة تسمح للطالب بمعرفة ما إذا كان عدد كبير يقبل القسمة على عدد آخر بدون أي باقٍ دون الحاجة لإجراء قسمة مطولة مضنية. تعتمد هذه القواعد إما على فحص خانة الآحاد فقط، أو فحص آخر رقمين، أو جمع أرقام العدد كلياً. إتقان هذه القواعد يمثل حجر الأساس لتبسيط الكسور وإيجاد العوامل المشتركة وحل المسائل اللفظية بسرعة استثنائية في منهج كامبريدج.", "goldenRules": ["القسمة على 2: إذا كان رقم الآحاد زوجياً (0, 2, 4, 6, 8).", "القسمة على 3: إذا كان مجموع جميع أرقام العدد يقبل القسمة على 3 (مثال: 435 ➔ 4+3+5=12).", "القسمة على 4: إذا كان العدد المكون من آخر رقمين (آحاد وعشرات) يقبل القسمة على 4 (مثال: 528 ➔ 28÷4=7).", "القسمة على 5: إذا كان رقم الآحاد 0 أو 5.", "القسمة على 6: إذا كان العدد يقبل القسمة على 2 و 3 معاً (زوجي ومجموع أرقامه من مضاعفات 3).", "القسمة على 8: إذا كان العدد المكون من آخر ثلاثة أرقام يقبل القسمة على 8.", "القسمة على 9: إذا كان مجموع أرقام العدد يقبل القسمة على 9 (مثال: 4,356 ➔ 4+3+5+6=18).", "القسمة على 10: إذا كان رقم الآحاد 0.", "القسمة على 25: إذا كان آخر رقمين هما: 00 أو 25 أو 50 أو 75.", "القسمة على 100: إذا انتهى العدد بصفرين (00)."], "workedExamples": [{"concept": "فحص شامل لقابلية قسمة العدد: 7,425", "explanation": "1. الآحاد = 5 ➔ يقبل القسمة على 5 ولا يقبل على 2 أو 10.\n2. آخر رقمين = 25 ➔ يقبل القسمة على 25 ولا يقبل على 4 أو 100.\n3. مجموع الأرقام: 7 + 4 + 2 + 5 = 18 ➔ يقبل القسمة على 3 وعلى 9 لأن 18 من مضاعفات الـ 9.\n4. هل يقبل على 6؟ لا، لأنه ليس زوجياً.\nالخلاصة: 7,425 يقبل القسمة على: 3, 5, 9, 25."}], "examTraps": ["فخ قابلية القسمة على 9 مقابل 3: كل عدد يقبل القسمة على 9 يقبل حتماً على 3، ولكن ليس كل عدد يقبل على 3 يقبل على 9! (مثال: 12 و 15 و 24 تقبل على 3 ولا تقبل على 9).", "فخ القسمة على 4: لا تفحص رقم الآحاد فقط؛ افحص العدد المكون من الآحاد والعشرات معاً (مثال: 314 آحاده 4 لكن 14 لا تقبل على 4)."]}, "flashcards": [{"id": 1, "front": "ما هي قاعدة قابلية القسمة على 3؟", "back": "إذا كان مجموع أرقام العدد كلياً يقبل القسمة على 3.", "tip": "اجمع الأرقام معاً."}, {"id": 2, "front": "ما هي قاعدة قابلية القسمة على 4؟", "back": "إذا كان العدد المكون من آخر رقمين (الآحاد والعشرات) يقبل القسمة على 4.", "tip": "انظر لآخر خانتين فقط."}, {"id": 3, "front": "ما الشرطان الواجب توافرهما في عدد ليقبل القسمة على 6؟", "back": "يجب أن يكون زوجياً (يقبل على 2) ومجموع أرقامه يقبل على 3 في نفس الوقت.", "tip": "يقبل على 2 و 3 معاً."}, {"id": 4, "front": "هل العدد 4,122 يقبل القسمة على 3 وعلى 6؟", "back": "نعم، آحاده زوجي 2، ومجموع أرقامه 4+1+2+2 = 9 (يقبل على 3) ➔ يقبل على 3 و 6.", "tip": "افحص الزوجية والمجموع."}, {"id": 5, "front": "ما هي قاعدة قابلية القسمة على 9؟", "back": "إذا كان مجموع أرقام العدد يقبل القسمة على 9.", "tip": "مثل قاعدة 3 تماماً لكن الناتج يقسم 9."}, {"id": 6, "front": "ما هي النهايات الأربع المحتملة لأي عدد يقبل القسمة على 25؟", "back": "ينتهي بـ: 00، أو 25، أو 50، أو 75.", "tip": "أرباع المائة."}, {"id": 7, "front": "هل العدد 5,316 يقبل القسمة على 4؟ وضح السبب.", "back": "نعم، لأن آخر رقمين هما 16، والعدد 16 يقبل القسمة على 4 (16 ÷ 4 = 4).", "tip": "16 من جدول الـ 4."}, {"id": 8, "front": "هل كل عدد يقبل القسمة على 3 يقبل بالضرورة على 9؟", "back": "لا، فمثلاً العدد 12 يقبل على 3 لكنه لا يقبل على 9.", "tip": "العكس هو الصحيح دائماً."}, {"id": 9, "front": "ما هو أصغر رقم يمكن إضافته للعدد 7,12_ ليقبل القسمة على 5 و 10؟", "back": "الرقم صفر (0) ليصبح 7,120.", "tip": "يقبل على 10 يعني آحاده صفر."}, {"id": 10, "front": "اختبر العدد 1,234,560: هل يقبل على 2 و 5 و 10؟ ولماذا؟", "back": "نعم يقبل عليها جميعاً لأن رقم آحاده هو صفر (0).", "tip": "الصفر يحقق قواعد 2 و 5 و 10."}]}, {"id": "math105_rounding_pv", "subjectCode": "Math 105", "student": "Ali", "unitNumber": 2, "title": "محاكي التقريب والقيمة المكانية حتى 1,000,000", "titleEn": "Place Value & Rounding up to 1,000,000 (The Number Hill)", "icon": "⛰️", "videoId": "", "relatedExamId": "DAILY_Y5_MATH_W1D1", "theory": {"overview": "التقريب (Rounding) هو استبدال عدد بعدد آخر قريب منه وسهل التعامل معه ذهنياً (ينتهي بأصفار)، ويُستخدم لتقدير التكاليف والأبعاد والمسافات السريعة. في الصف الخامس، يتقن الطالب تقريب الأعداد حتى مليون (لأقرب 10، 100، 1,000، 10,000، 100,000). قاعدة 'تلة التقريب' (The Rounding Hill) تنص على: نحدد الخانة المراد التقريب إليها، ثم ننظر إلى الرقم الذي يقع مباشرة على يمينها: إذا كان 4 أو أقل (0, 1, 2, 3, 4) يظل الرقم كما هو وتتحول باقي الأرقام يميناً إلى أصفار (Round Down). وإذا كان 5 أو أكثر (5, 6, 7, 8, 9) نضيف 1 إلى رقم الخانة وتتحول باقي الأرقام يميناً إلى أصفار (Round Up).", "goldenRules": ["حدد خانة الهدف (Target Digit) وضع خطاً تحتها.", "انظر فقط للرقم المجاور على يمينها مباشرة (The Deciding Digit).", "إذا كان الرقم 0 إلى 4: اهبط لأسفل (يبقى الرقم دون زيادة)، وتحول الخانات على يمينه إلى أصفار.", "إذا كان الرقم 5 إلى 9: اصعد لأعلى (أضف 1 للخانة)، وتحول الخانات على يمينه إلى أصفار.", "جميع الأرقام التي على يسار الخانة المستهدفة تبقى دون تغيير (ما لم يحدث حمل 9 ➔ 10).", "التقريب مفيد للتحقق من معقولية نتائج الحسابات الكبيرة قبل البدء."], "workedExamples": [{"concept": "تقريب العدد 468,725 لعدة مستويات مختلفة", "explanation": "لأقرب 10: ننظر للآحاد (5) ➔ نقرب لأعلى ➔ 468,730.\nلأقرب 100: ننظر للعشرات (2) ➔ نقرب لأسفل ➔ 468,700.\nلأقرب 1,000: ننظر للمئات (7) ➔ نقرب لأعلى ➔ 469,000.\nلأقرب 10,000: ننظر للآلاف (8) ➔ نقرب لأعلى ➔ 470,000.\nلأقرب 100,000: ننظر لعشرات الآلاف (6) ➔ نقرب لأعلى ➔ 500,000."}], "examTraps": ["فخ الرقم 9 المتكرر: عند تقريب 49,960 لأقرب 100، خانة العشرات 6 فترفع الـ 9 إلى 10، مما يرحل 1 لخانة الآلاف لتصبح 50,000!", "فخ النظر لرقم بعيد: لا تنظر أبداً لأكثر من رقم واحد فقط (الرقم الذي على يمين الخانة المستهدفة مباشرة)."]}, "flashcards": [{"id": 1, "front": "ما هي القاعدة الذهبية المحددة للصعود لأعلى (Round Up) في التقريب؟", "back": "إذا كان الرقم الواقع على يمين الخانة المستهدفة مباشرة هو 5 أو أكثر (5, 6, 7, 8, 9).", "tip": "خمسة فما فوق."}, {"id": 2, "front": "قرّب العدد 4,372 لأقرب 100.", "back": "4,400 (لأن رقم العشرات 7 وهو أكبر من 5 فيرفع المئات).", "tip": "انظر للعشرات 7."}, {"id": 3, "front": "قرّب العدد 84,219 لأقرب 1,000.", "back": "84,000 (لأن رقم ال   function openStudioUnit(unitId) {
    const unit = window.STEM_STUDIO_MAP[unitId];
    if (!unit) {
      alert('وحدة الاستديو قيد الإعداد.');
      return;
    }
    currentStudioUnit = unit;
    currentFlashcardIndex = 0;
    isFlashcardFlipped = false;

    const modal = document.getElementById('unit-studio-modal');
    if (!modal) return;

    // Header metadata
    document.getElementById('studio-modal-title').textContent = unit.title;
    document.getElementById('studio-modal-sub').textContent = unit.titleEn;
    document.getElementById('studio-modal-icon').textContent = unit.icon;
    document.getElementById('studio-modal-subject').textContent = unit.subjectCode + ' • ' + unit.student;

    // 1. Render Theory Tab
    renderStudioTheory(unit);

    // 2. Render Flashcards Tab
    renderStudioFlashcard();

    // 3. Render Lab Tab
    renderStudioLab(unit.id);

    // 4. Render Video Tab
    renderStudioVideo(unit);

    // Default to Theory tab
    switchStudioTab('theory');

    modal.classList.add('active');
  }

  function closeStudioModal() {
    stopAudioTone();
    if (heartAnimInterval) {
      clearInterval(heartAnimInterval);
      heartAnimInterval = null;
    }
    const modal = document.getElementById('unit-studio-modal');
    if (modal) modal.classList.remove('active');
  }

  function switchStudioTab(tabName) {
    ['theory', 'flashcards', 'lab', 'video'].forEach(function(t) {
      const pane = document.getElementById('studio-tab-pane-' + t);
      const btn = document.getElementById('studio-tab-btn-' + t);
      if (pane) pane.style.display = (t === tabName) ? 'block' : 'none';
      if (btn) {
        if (t === tabName) {
          btn.classList.add('active');
          btn.style.borderBottom = '3px solid #0284c7';
          btn.style.color = '#0284c7';
          btn.style.fontWeight = '800';
        } else {
          btn.classList.remove('active');
          btn.style.borderBottom = '3px solid transparent';
          btn.style.color = '#64748b';
          btn.style.fontWeight = '600';
        }
      }

  function renderStudioFlashcard() {
    if (!currentStudioUnit || !currentStudioUnit.flashcards) return;
    const cards = currentStudioUnit.flashcards;
    const card = cards[currentFlashcardIndex];

    const cardBox = document.getElementById('studio-flashcard-box');
    const counter = document.getElementById('studio-flashcard-counter');
    const cardFront = document.getElementById('studio-card-front');
    const cardBack = document.getElementById('studio-card-back');
    const cardTip = document.getElementById('studio-card-tip');

    if (!cardBox || !card) return;

    isFlashcardFlipped = false;
    cardBox.classList.remove('flipped');

    counter.textContent = 'بطاقة ' + (currentFlashcardIndex + 1) + ' من ' + cards.length;
    cardFront.textContent = card.front;
    cardBack.textContent = card.back;
    cardTip.textContent = '💡 تلميح: ' + (card.tip || 'انقر للقلب واختبار استيعابك');

    // Update progress bar
    const progressEl = document.getElementById('studio-flashcard-progress-bar');
    if (progressEl) {
      const pct = Math.round(((currentFlashcardIndex + 1) / cards.length) * 100);
      progressEl.style.width = pct + '%';
    }
  }

  function flipFlashcard() {
    const cardBox = document.getElementById('studio-flashcard-box');
    if (!cardBox) return;
    isFlashcardFlipped = !isFlashcardFlipped;
    if (isFlashcardFlipped) {
      cardBox.classList.add('flipped');
    } else {
      cardBox.classList.remove('flipped');
    }
  }

  function nextFlashcard() {
    if (!currentStudioUnit) return;
    const total = currentStudioUnit.flashcards.length;
    currentFlashcardIndex = (currentFlashcardIndex + 1) % total;
    renderStudioFlashcard();
  }

  function prevFlashcard() {
    if (!currentStudioUnit) return;
    const total = currentStudioUnit.flashcards.length;
    currentFlashcardIndex = (currentFlashcardIndex - 1 + total) % total;
    renderStudioFlashcard();
  }

  let heartAnimInterval = null;
  function startHeartAnimation(bpm) {
    if (heartAnimInterval) clearInterval(heartAnimInterval);
    const intervalMs = (60 / bpm) * 1000;
    const body = document.getElementById('heart-body');
    if (!body) return;

    heartAnimInterval = setInterval(function() {
      body.style.transform = 'scale(1.05)';
      body.style.transformOrigin = 'center';
      body.style.transition = 'transform 0.1s ease-out';
      setTimeout(function() {
        if (body) body.style.transform = 'scale(1.0)';
      }, 120);
    }, intervalMs);
  }

  window.updateHeartBPM = function(val) {
    document.getElementById('bpm-val').textContent = val + ' BPM';
    startHeartAnimation(parseInt(val, 10));
  };

  window.setHeartPreset = function(bpm, mode) {
    document.getElementById('bpm-slider').value = bpm;

  window.updateParachutePhysics = function() {
    const m = parseFloat(document.getElementById('para-mass-slider').value);
    const a = parseFloat(document.getElementById('para-area-slider').value);
    document.getElementById('para-mass-val').textContent = m + ' kg';
    document.getElementById('para-area-val').textContent = a + ' m²';

    const weight = Math.round(m * 9.8);
    const vt_ms = Math.sqrt((2 * weight) / (1.8 * a));
    const vt_kmh = Math.round(vt_ms * 3.6);

    document.getElementById('para-weight-calc').textContent = weight + ' N';
    document.getElementById('para-terminal-calc').textContent = vt_kmh + ' km/h (' + vt_ms.toFixed(1) + ' m/s)';

    const safety = document.getElementById('para-safety-calc');
    if (vt_kmh <= 20) {
      safety.textContent = '🟢 هبوط آمن وناعم جداً';
      safety.style.color = '#166534';
    } else if (vt_kmh <= 35) {
      safety.textContent = '🟡 هبوط سريع يتطلب تدريباً';
      safety.style.color = '#ca8a04';
    } else {
      safety.textContent = '🔴 هبوط خطير جداً (المظلة صغيرة!)';
      safety.style.color = '#dc2626';
    }
  };

  window.runParachuteDrop = function() {
    const sprite = document.getElementById('skydiver-sprite');
    const overlay = document.getElementById('drop-status-overlay');
    if (!sprite || !overlay) return;

    sprite.style.top = '15px';
    overlay.textContent = 'المظلي يهبط في الهواء... مقاومة الهواء تتزايد تدريجياً!';

    let pos = 15;
    const a = parseFloat(document.getElementById('para-area-slider').value);
    const stepSpeed = Math.max(2, Math.min(10, Math.round(40 / Math.sqrt(a))));

    const dropTimer = setInterval(function() {
      pos += stepSpeed;
      sprite.style.top = pos + 'px';
      if (pos >= 180) {
        clearInterval(dropTimer);
        const vt = document.getElementById('para-terminal-calc').textContent;
        overlay.innerHTML = '🎉 <b>تم الهبوط بنجاح!</b> السرعة النهائية الثابتة: ' + vt;
      }
    }, 40);
  };

      btn.textContent = 'مفتاح مفتوح (OFF)';

      if (arm) {
        arm.setAttribute('x2', '65');
        arm.setAttribute('y2', '110');
        arm.setAttribute('stroke', '#ef4444');
      }
    } else {
      btn.textContent = 'مفتاح مغلق (ON)';
      btn.style.background = '#00b074';
      if (arm) {
        arm.setAttribute('x2', '40');
        arm.setAttribute('y2', '130');

      }
    }
    updateCircuitSim();

  window.updateCircuitSim = function() {
    const mat = document.getElementById('circuit-material').value;
    const volt = parseFloat(document.getElementById('circuit-voltage').value);
    const glow = document.getElementById('svg-bulb-glow');
    const core = document.getElementById('svg-bulb-core');
    const label = document.getElementById('svg-material-label');
    const readout = document.getElementById('circuit-status-readout');

    const conductors = ['copper', 'graphite', 'iron'];
    const isConductor = conductors.includes(mat);

    if (label) {
      const names = {
        copper: 'نحاس (موصل)',
        graphite: 'جرافيت (موصل لافلزي)',
        iron: 'حديد (موصل)',
        plastic: 'بلاستيك (عازل)',
        rubber: 'مطاط (عازل)',
        wood: 'خشب (عازل)'
      };
      label.textContent = names[mat] || mat;
    }

    if (!circuitSwitchOpen && isConductor) {
      const opacity = Math.min(1.0, 0.25 * volt);
      const radius = 20 + volt * 6;
      if (glow) {
        glow.style.display = 'block';
        glow.setAttribute('r', radius);
        glow.setAttribute('fill', 'rgba(253, 224, 71, ' + opacity + ')');
      }
      if (core) core.setAttribute('fill', '#fef08a');

      readout.innerHTML = 
        '<div style="color: #15803d; font-weight: 800;">🟢 الدائرة مغلقة ومكتملة!</div>' +
        '<div>المادة: <b style="color:#0284c7;">موصل كهربائي</b> يسمح بسريان الإلكترونات.</div>' +
        '<div>شدة الإضاءة: <b>' + (volt >= 4.5 ? 'عالية جداً 🔥' : 'قياسية 💡') + ' (' + volt + 'V)</b></div>';
    } else {
      if (glow) glow.style.display = 'none';
      if (core) core.setAttribute('fill', '#64748b');

      let reason = circuitSwitchOpen ? 'المفتاح مفتوح (فجوة في الدائرة)' : 'المادة المختارة عازلة لا تحتوي إلكترونات حرة';
      readout.innerHTML = 
        '<div style="color: #b91c1c; font-weight: 800;">🔴 المصباح منطفئ</div>' +
        '<div>السبب: <b>' + reason + '</b>.</div>' +
        '<div>حالة الدائرة: غير مكتملة (Incomplete Circuit).</div>';

  };

  window.updateMeniscusSim = function() {
    const trueVol = parseInt(document.getElementById('meniscus-slider').value, 10);
    const eye = document.getElementById('meniscus-eye').value;
    document.getElementById('meniscus-vol-val').textContent = trueVol + ' mL';

    let recordedVol = trueVol;
    let yOffset = 0;
    if (eye === 'high') {
      recordedVol = trueVol + 4;
      yOffset = -15;
    } else if (eye === 'low') {
      recordedVol = trueVol - 4;
      yOffset = 15;
    }

    const baseLiquidY = 160 - (trueVol * 1.2);
    const curve = document.getElementById('svg-meniscus-curve');
    const body = document.getElementById('svg-liquid-body');
    const line = document.getElementById('svg-sight-line');
    const eyeIcon = document.getElementById('svg-eye-icon');
    const tag = document.getElementById('svg-reading-tag');
    const fb = document.getElementById('meniscus-feedback');

    if (curve) curve.setAttribute('d', 'M 93 ' + baseLiquidY + ' Q 140 ' + (baseLiquidY + 10) + ', 187 ' + baseLiquidY + ' L 187 178 L 93 178 Z');
    if (body) {
      body.setAttribute('y', baseLiquidY);
      body.setAttribute('height', 178 - baseLiquidY);
    }

    const sightY = (baseLiquidY + 10) + yOffset;
    if (line) {
      line.setAttribute('y1', sightY);
      line.setAttribute('y2', sightY);
    }
    if (eyeIcon) eyeIcon.setAttribute('y', sightY - 2);
    if (tag) {
      tag.setAttribute('y', sightY + 4);
      tag.textContent = recordedVol + ' mL';
    }

    if (eye === 'level') {
      fb.innerHTML = '<span style="color: #15803d; font-weight: 800;">🟢 قراءة صحيحة 100%!</span><br>العين عند قاع القوس المقعر تماماً (Bottom of Meniscus). القراءة الدقيقة: <b>' + trueVol + ' mL</b>.';
    } else if (eye === 'high') {
      fb.innerHTML = '<span style="color: #dc2626; font-weight: 800;">🔴 خطأ زاوية الرؤية (Parallax High Error)!</span><br>النظر من أعلى أعطى قراءة خادعة أعلى من الواقع: <b>' + recordedVol + ' mL</b> (الواقع ' + trueVol + ' mL).';
    } else {
      fb.innerHTML = '<span style="color: #dc2626; font-weight: 800;">🔴 خطأ زاوية الرؤية (Parallax Low Error)!</span><br>النظر من أسفل أعطى قراءة خادعة أقل من الواقع: <b>' + recordedVol + ' mL</b> (الواقع ' + trueVol + ' mL).';
    }
  };

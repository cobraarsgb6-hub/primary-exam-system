  window.shiftPlaceValue = function(factor) {
    const input = document.getElementById('pv-num-input');
    let val = parseFloat(input.value) || 0;
    val = Math.round(val * factor);
    if (val > 9999999) val = 9999999;
    if (val < 0) val = 0;
    input.value = val;
    updatePlaceValueSim();
  };

  window.updatePlaceValueSim = function() {
    const val = parseInt(document.getElementById('pv-num-input').value, 10) || 0;
    const str = String(val).padStart(7, '0');
    const cols = [
      { name: 'الملايين', sub: 'M (10⁶)', color: '#be185d', bg: '#fdf2f8' },
      { name: 'مئات الآلاف', sub: 'HTh (10⁵)', color: '#7c3aed', bg: '#f5f3ff' },
      { name: 'عشرات الآلاف', sub: 'TTh (10⁴)', color: '#2563eb', bg: '#eff6ff' },
      { name: 'آحاد الآلاف', sub: 'Th (10³)', color: '#0284c7', bg: '#f0f9ff' },
      { name: 'المئات', sub: 'H (10²)', color: '#059669', bg: '#ecfdf5' },
      { name: 'العشرات', sub: 'T (10¹)', color: '#d97706', bg: '#fffbeb' },
      { name: 'الآحاد', sub: 'O (1)', color: '#dc2626', bg: '#fef2f2' }
    ];

    const grid = document.getElementById('pv-columns-grid');
    if (!grid) return;

    grid.innerHTML = cols.map(function(col, idx) {
      const digit = parseInt(str[idx], 10);
      let discs = '';
      for (let i = 0; i < digit; i++) {
        discs += '<div style="width: 16px; height: 16px; border-radius: 50%; background: ' + col.color + '; margin: 2px auto;"></div>';
      }
      return '<div style="background: ' + col.bg + '; border: 1.5px solid ' + col.color + '; border-radius: 8px; padding: 8px 4px;">' +
               '<div style="font-size: 0.72rem; font-weight: 800; color: ' + col.color + ';">' + col.name + '</div>' +

  window.setPrimeTreeNum = function(n) {

  window.generatePrimeTree = function() {
    const n = parseInt(document.getElementById('prime-tree-input').value, 10) || 72;
    const factors = getPrimeFactorsList(n);

    const counts = {};
    factors.forEach(function(f) { counts[f] = (counts[f] || 0) + 1; });
    const indexStr = Object.keys(counts).map(function(k) {
      return counts[k] > 1 ? (k + '<sup>' + counts[k] + '</sup>') : k;
    }).join(' × ');

    document.getElementById('prime-tree-result').innerHTML = 
      '<div>تحليل العدد <b>' + n + '</b> إلى عوامل أولية: ' + factors.join(' × ') + '</div>' +
      '<div style="margin-top: 4px; font-size: 1.05rem; color: #047857;">الصيغة الأسية (Index Notation): <b>' + indexStr + '</b></div>';

    const box = document.getElementById('prime-tree-svg-box');
    box.innerHTML = 
      '<div style="display: flex; flex-direction: column; align-items: center; gap: 12px;">' +
        '<div style="background: #0284c7; color: #fff; font-weight: 900; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; box-shadow: 0 4px 10px rgba(2,132,199,0.3);">' + n + '</div>' +

        '<div style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;">' +
          factors.map(function(f) {
            return '<div style="background: #059669; color: #fff; font-weight: 900; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.05rem; border: 3px solid #6ee7b7; box-shadow: 0 3px 8px rgba(5,150,105,0.25);">' + f + '</div>';

        '</div>' +
        '<div style="font-size: 0.78rem; color: #065f46; font-weight: 700;">🟢 الدوائر الخضراء تمثل الأوراق الأولية (Prime Leaves) التي لا تتفكك بعد ذلك</div>' +
      '</div>';
  };

  function getPrimeFactorsList(num) {
    const factors = [];
    let d = 2;
    while (num >= 2) {
      if (num % d === 0) {
        factors.push(d);
        num = num / d;
      } else {
        d++;
      }
    }
    return factors;
  }

  window.updateFDPSim = function() {
    const val = parseFloat(document.getElementById('fdp-slider').value);

    document.getElementById('fdp-dec-val').textContent = dec;

    let frac = getClosestFraction(val);
    document.getElementById('fdp-frac-val').textContent = frac;
  };

  function getClosestFraction(pct) {
    if (Math.abs(pct - 50) < 0.2) return '1/2';
    if (Math.abs(pct - 25) < 0.2) return '1/4';
    if (Math.abs(pct - 75) < 0.2) return '3/4';
    if (Math.abs(pct - 20) < 0.2) return '1/5';
    if (Math.abs(pct - 40) < 0.2) return '2/5';
    if (Math.abs(pct - 60) < 0.2) return '3/5';
    if (Math.abs(pct - 80) < 0.2) return '4/5';
    if (Math.abs(pct - 12.5) < 0.2) return '1/8';
    if (Math.abs(pct - 37.5) < 0.2) return '3/8';
    if (Math.abs(pct - 62.5) < 0.2) return '5/8';
    if (Math.abs(pct - 87.5) < 0.2) return '7/8';
    if (Math.abs(pct - 33.33) < 0.5) return '1/3';
    if (Math.abs(pct - 66.66) < 0.5) return '2/3';
    if (Math.abs(pct - 10) < 0.2) return '1/10';
    return Math.round(pct) + '/100';
  }

  window.updateBODMASLine = function() {
    const a = parseInt(document.getElementById('num-a').value, 10) || 0;
    const b = parseInt(document.getElementById('num-b').value, 10) || 0;
    const op = document.getElementById('op-sign').value;

    let res = 0;
    let exp = '';
    if (op === 'minus') {
      res = a - b;
      if (b < 0) {
        exp = a + ' - (' + b + ') = ' + a + ' + ' + Math.abs(b) + ' = ' + res + ' ➔ طرح السالب يعني التحرك يميناً (+) على خط الأعداد!';
      } else {
        exp = a + ' - ' + b + ' = ' + res + ' ➔ تحرك يساراً (-) بمقدار ' + b + ' وحدات.';
      }
    } else {
      res = a + b;
      exp = a + ' + (' + b + ') = ' + res;
    }

    document.getElementById('line-result-val').textContent = res;
    document.getElementById('line-explanation').textContent = exp;

    const dot = document.getElementById('svg-result-dot');
    if (dot) {
      const cx = Math.max(-105, Math.min(105, res * 10));
      dot.setAttribute('cx', cx);
    }
  };

  window.updatePitchSim = function() {
    const freq = parseInt(document.getElementById('synth-pitch-slider').value, 10);
    const amp = parseInt(document.getElementById('synth-loud-slider').value, 10);
    document.getElementById('synth-pitch-val').textContent = freq + ' Hz';
    document.getElementById('synth-loud-val').textContent = amp + '%';

    const wave = document.getElementById('svg-osc-wave');
    const notes = document.getElementById('osc-wave-notes');
    if (wave) {
      const height = (amp / 100) * 65;
      const cycles = Math.max(1, Math.min(8, Math.round(freq / 120)));
      const segWidth = 320 / (cycles * 2);

      let d = 'M 0 80 ';
      for (let i = 0; i < cycles; i++) {
        const x1 = (i * 2) * segWidth + segWidth;
        const x2 = (i * 2 + 1) * segWidth + segWidth;
        const yTop = 80 - height;
        const yBot = 80 + height;
        d += 'Q ' + (x1 - segWidth/2) + ' ' + yTop + ', ' + x1 + ' 80 Q ' + (x2 - segWidth/2) + ' ' + yBot + ', ' + x2 + ' 80 ';
      }
      wave.setAttribute('d', d);
      wave.setAttribute('stroke', freq >= 600 ? '#f43f5e' : (freq <= 300 ? '#38bdf8' : '#22c55e'));
    }

    if (notes) {
      notes.innerHTML = 
        '<div>الموجة على الشاشة: <b>' + (amp >= 70 ? 'قمم مرتفعة (صوت عالٍ)' : 'قمم قصيرة (صوت هادئ)') + '</b>.</div>' +
        '<div>كثافة الموجات: <b>' + (freq >= 600 ? 'موجات متقاربة جداً (حدة عالية)' : 'موجات متباعدة (حدة منخفضة غليظة)') + '</b>.</div>';
    }

    if (activeAudioOsc && activeAudioOsc.frequency) {
      activeAudioOsc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    }
  };

  window.toggleAudioTone = function() {
    const btn = document.getElementById('btn-audio-synth');
    if (activeAudioOsc) {
      stopAudioTone();
      if (btn) {
        btn.textContent = '🔊 تشغيل الصوت الحقيقي';
        btn.style.background = '#7c3aed';
      }
    } else {
      startAudioTone();
      if (btn) {
        btn.textContent = '⏹️ إيقاف الصوت';
        btn.style.background = '#dc2626';
      }
    }
  };

  function startAudioTone() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const freq = parseInt(document.getElementById('synth-pitch-slider').value, 10);
      const amp = parseInt(document.getElementById('synth-loud-slider').value, 10) / 100;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(amp * 0.15, audioCtx.currentTime);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      activeAudioOsc = osc;
    } catch (e) {
      console.warn('Web Audio not allowed without interaction:', e);
    }
  }

  function stopAudioTone() {
    if (activeAudioOsc) {
      try { activeAudioOsc.stop(); } catch(e) {}
      activeAudioOsc = null;
    }
  }

          '<h4 style="margin: 0 0 4px 0; font-size: 1.1rem; font-weight: 800; color: #0f172a;">⚡ فاحص قابلية القسمة الذكي (10 قواعد معاً)</h4>' +
          '<span style="font-size: 0.8rem; color: #64748b;">أدخل أي عدد وشاهد مصفوفة الفحص الفوري تضيء بالأخضر أو الأحمر مع التبرير</span>' +
        '</div>' +

        '<div style="display: flex; gap: 10px; margin-bottom: 14px; align-items: center; flex-wrap: wrap;">' +
          '<input type="number" id="divisibility-input" class="input-base" value="7425" min="1" max="9999999" style="width: 150px; font-weight: 800; font-size: 1.1rem; padding: 6px 10px;" oninput="testDivisibilityNow()">' +
          '<button type="button" class="portal-btn" style="padding: 6px 12px;" onclick="setDivisibilityVal(4356)">4,356</button>' +
          '<button type="button" class="portal-btn" style="padding: 6px 12px;" onclick="setDivisibilityVal(7425)">7,425</button>' +
          '<button type="button" class="portal-btn" style="padding: 6px 12px;" onclick="setDivisibilityVal(12840)">12,840</button>' +
          '<button type="button" class="portal-btn" style="padding: 6px 12px;" onclick="setDivisibilityVal(50025)">50,025</button>' +
        '</div>' +

        '<div id="divisibility-matrix-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px;">' +
          '<!-- Populated dynamically -->' +
        '</div>' +
      '</div>';

    testDivisibilityNow();
  }

  window.setDivisibilityVal = function(v) {
    document.getElementById('divisibility-input').value = v;
    testDivisibilityNow();
  };

  window.testDivisibilityNow = function() {
    const n = parseInt(document.getElementById('divisibility-input').value, 10) || 0;
    const str = String(n);
    const lastD = n % 10;
    const last2 = n % 100;
    const last3 = n % 1000;
    const sumDigits = str.split('').reduce(function(acc, c) { return acc + parseInt(c, 10); }, 0);

    const rules = [
      { d: 2, ok: (lastD % 2 === 0), rule: 'الآحاد زوجي (' + lastD + ')' },
      { d: 3, ok: (sumDigits % 3 === 0), rule: 'مجموع الأرقام = ' + sumDigits + ' (' + (sumDigits % 3 === 0 ? 'يقبل' : 'لا يقبل') + ')' },
      { d: 4, ok: (last2 % 4 === 0), rule: 'آخر رقمين (' + last2 + ') ' + (last2 % 4 === 0 ? 'يقبل ÷ 4' : 'لا يقبل') },
      { d: 5, ok: (lastD === 0 || lastD === 5), rule: 'الآحاد (' + lastD + ') هو 0 أو 5' },
      { d: 6, ok: (lastD % 2 === 0 && sumDigits % 3 === 0), rule: 'يقبل على 2 و 3 معاً' },
      { d: 8, ok: (last3 % 8 === 0), rule: 'آخر 3 أرقام (' + last3 + ') ÷ 8' },
      { d: 9, ok: (sumDigits % 9 === 0), rule: 'مجموع الأرقام = ' + sumDigits + ' (' + (sumDigits % 9 === 0 ? 'يقبل ÷ 9' : 'لا يقبل') + ')' },
      { d: 10, ok: (lastD === 0), rule: 'الآحاد هو صفر (0)' },
      { d: 25, ok: ([0, 25, 50, 75].includes(last2)), rule: 'ينتهي بـ: 00، 25، 50، 75' },
      { d: 100, ok: (last2 === 0), rule: 'ينتهي بصفرين (00)' }
    ];

    const grid = document.getElementById('divisibility-matrix-grid');
    if (!grid) return;

    grid.innerHTML = rules.map(function(r) {
      const color = r.ok ? '#15803d' : '#991b1b';
      const bg = r.ok ? '#f0fdf4' : '#fef2f2';
      const border = r.ok ? '#86efac' : '#fecaca';
      const icon = r.ok ? '✅ يقبل' : '❌ لا يقبل';

      return '<div style="background: ' + bg + '; border: 1.5px solid ' + border + '; border-radius: 10px; padding: 10px 12px;">' +
               '<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">' +
                 '<span style="font-weight: 900; font-size: 1.1rem; color: #0f172a;">قاعدة الـ ' + r.d + '</span>' +
                 '<span style="font-size: 0.78rem; font-weight: 800; color: ' + color + ';">' + icon + '</span>' +
               '</div>' +
               '<div style="font-size: 0.78rem; color: #475569;">' + r.rule + '</div>' +
             '</div>';
    }).join('');
  };

  // -------------------------------------------------------------------------
  // LAB 18: Rounding Number Hill
  // -------------------------------------------------------------------------
  function renderRoundingLab(container) {
    container.innerHTML = 
      '<div style="background: #ffffff; border: 1.5px solid #e2e8f0; border-radius: 14px; padding: 18px;">' +
        '<div style="margin-bottom: 12px;">' +
          '<h4 style="margin: 0 0 4px 0; font-size: 1.1rem; font-weight: 800; color: #0f172a;">⛰️ تلة التقريب الكروية (The Number Hill)</h4>' +
          '<span style="font-size: 0.8rem; color: #64748b;">شاهد الكرة تنزلق لأسفل (0-4) أو تصعد لقمة التل وتقفز للأعلى (5-9)</span>' +
        '</div>' +

        '<div style="display: flex; gap: 10px; margin-bottom: 14px; align-items: center; flex-wrap: wrap;">' +
          '<input type="number" id="rounding-input" class="input-base" value="468725" min="0" max="9999999" style="width: 140px; font-weight: 800; font-size: 1rem; padding: 6px 10px;" oninput="updateRoundingSim()">' +
          '<select id="rounding-target-level" class="input-base" style="font-weight: 800; padding: 6px;" onchange="updateRoundingSim()">' +
            '<option value="10">لأقرب 10</option>' +
            '<option value="100">لأقرب 100</option>' +
            '<option value="1000" selected>لأقرب 1,000</option>' +
            '<option value="10000">لأقرب 10,000</option>' +
            '<option value="100000">لأقرب 100,000</option>' +
          '</select>' +
        '</div>' +

        '<div style="background: #0f172a; border-radius: 12px; padding: 16px; text-align: center; border: 1.5px solid #334155; margin-bottom: 12px;">' +
          '<svg id="rounding-svg" viewBox="0 0 320 140" style="width: 100%; max-width: 320px; height: auto;">' +
            '<!-- Curved Hill -->' +
            '<path d="M 30 110 Q 160 20, 290 110" fill="none" stroke="#64748b" stroke-width="4"/>' +
            '<!-- Peak Mark (5) -->' +
            '<line x1="160" y1="55" x2="160" y2="70" stroke="#f59e0b" stroke-width="2"/>' +
            '<text x="160" y="48" font-size="10" font-weight="900" fill="#fcd34d" text-anchor="middle">قمة التل (5)</text>' +
            '<!-- Lower Multiple Left -->' +
            '<text id="svg-round-low" x="30" y="130" font-size="11" font-weight="800" fill="#38bdf8" text-anchor="middle">468,000</text>' +
            '<!-- Upper Multiple Right -->' +
            '<text id="svg-round-high" x="290" y="130" font-size="11" font-weight="800" fill="#34d399" text-anchor="middle">469,000</text>' +
            '<!-- Rolling Sphere -->' +
            '<circle id="svg-round-ball" cx="160" cy="65" r="10" fill="#e11d48" stroke="#ffffff" stroke-width="2"/>' +
          '</svg>' +
        '</div>' +

        '<div id="rounding-explanation-readout" style="background: #f8fafc; border: 1.5px solid #cbd5e1; border-radius: 10px; padding: 12px; font-size: 0.88rem; color: #0f172a; line-height: 1.6;">' +
          'تفسير التقريب...' +
        '</div>' +
      '</div>';

    updateRoundingSim();
  }

  window.updateRoundingSim = function() {
    const val = parseInt(document.getElementById('rounding-input').value, 10) || 0;
    const level = parseInt(document.getElementById('rounding-target-level').value, 10) || 1000;

    const rounded = Math.round(val / level) * level;
    const lower = Math.floor(val / level) * level;
    const upper = lower + level;

    const rem = val % level;
    const decidingRatio = rem / level;
    const isRoundUp = (rounded === upper && val !== lower);

    document.getElementById('svg-round-low').textContent = lower.toLocaleString();
    document.getElementById('svg-round-high').textContent = upper.toLocaleString();

    const ball = document.getElementById('svg-round-ball');
    if (ball) {
      const cx = 30 + (decidingRatio * 260);
      const t = decidingRatio;
      const cy = 110 - 180 * t * (1 - t);
      ball.setAttribute('cx', cx);
      ball.setAttribute('cy', cy);
      ball.setAttribute('fill', isRoundUp ? '#10b981' : '#f43f5e');
    }

    const readout = document.getElementById('rounding-explanation-readout');
    if (readout) {
      readout.innerHTML = 
        '<div>العدد الأصلي: <b>' + val.toLocaleString() + '</b> ➔ التقريب لأقرب ' + level.toLocaleString() + ': <b style="color:#0284c7; font-size: 1.1rem;">' + rounded.toLocaleString() + '</b></div>' +
        '<div style="margin-top: 4px; color: #475569; font-size: 0.82rem;">' +
          (isRoundUp ? '🚀 تجاوزت النقطة منتصف التل (≥ 5)، فتدحرجت الكرة صعوداً للأعلى (Round Up).' : '🔻 لم تتجاوز النقطة المنتصف (< 5)، فانزلقت الكرة لأسفل نحو المضاعف الأصغر (Round Down).') +
        '</div>';
    }
  };

  // =========================================================================
  // 6. RENDER SUBJECT WORKSPACE UNITS LIST
  // =========================================================================

  function renderSubjectStudioUnits(subjectCode, containerId) {
    const container = document.getElementById(containerId);
    if (!container) return;

    const cleanCode = (subjectCode || '').toLowerCase();
    const matches = window.STEM_STUDIO_DATA.filter(function(u) {
      return u.subjectCode.toLowerCase().includes(cleanCode) || cleanCode.includes(u.subjectCode.toLowerCase());
    });

    if (!matches.length) {
      container.innerHTML = '<div style="color: #64748b; padding: 12px;">لا توجد وحدات استديو مسجلة لهذه المادة حالياً.</div>';
      return;
    }

    container.innerHTML = matches.map(function(u) {
      return '<div class="studio-unit-card" data-unit-id="' + u.id + '" style="background: #ffffff; border: 1.5px solid #e2e8f0; border-radius: 12px; padding: 14px; cursor: pointer; transition: all 0.2s; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">' +
               '<div style="display: flex; align-items: center; gap: 12px;">' +
                 '<span style="font-size: 1.8rem;">' + u.icon + '</span>' +
                 '<div>' +
                   '<div style="font-weight: 800; font-size: 0.95rem; color: #0f172a;">' + u.title + '</div>' +
                   '<div style="font-size: 0.78rem; color: #64748b;">' + u.titleEn + '</div>' +
                 '</div>' +
               '</div>' +
               '<div style="display: flex; align-items: center; gap: 8px;">' +
                 '<span style="font-size: 0.75rem; font-weight: 800; background: #e0f2fe; color: #0369a1; padding: 3px 8px; border-radius: 6px;">10 كروت</span>' +
                 '<span style="font-size: 0.75rem; font-weight: 800; background: #fef3c7; color: #92400e; padding: 3px 8px; border-radius: 6px;">معمل تفاعلي</span>' +
                 '<span style="color: #0284c7; font-weight: 800; font-size: 1.1rem;">&rarr;</span>' +
               '</div>' +
             '</div>';
    }).join('');

    // Attach click listeners safely
    const cards = container.querySelectorAll('.studio-unit-card');
    cards.forEach(function(card) {
      const uid = card.getAttribute('data-unit-id');
      card.onclick = function() {
        openStudioUnit(uid);
      };
      card.onmouseover = function() {
        card.style.borderColor = '#0284c7';
        card.style.transform = 'translateY(-2px)';
      };
      card.onmouseout = function() {
        card.style.borderColor = '#e2e8f0';
        card.style.transform = 'none';
      };
    });
  }

  // Utility
  function escapeHtml(text) {
    if (!text) return '';
    return String(text)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  // Public Exports
  window.openStudioUnit = openStudioUnit;
  window.closeStudioModal = closeStudioModal;
  window.switchStudioTab = switchStudioTab;
  window.flipFlashcard = flipFlashcard;
  window.nextFlashcard = nextFlashcard;
  window.prevFlashcard = prevFlashcard;
  window.renderSubjectStudioUnits = renderSubjectStudioUnits;

})();
</script>
